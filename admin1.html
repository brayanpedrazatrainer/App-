// ── SCHEDULE VIEW ────────────────────────────────────────────
const PHASES_SC=[
  {k:'menstrual',r:[1,5],e:'🌑',c:'#be185d',label:'Menstrual'},
  {k:'folicular',r:[6,13],e:'🌓',c:'#1d4ed8',label:'Folicular'},
  {k:'ovulatoria',r:[14,16],e:'🌕',c:'#b45309',label:'Ovulatoria'},
  {k:'lutea',r:[17,28],e:'🌗',c:'#7c3aed',label:'Lútea'},
];
function getCycleDayForDate(date,lastBleed,len){
  if(!lastBleed)return null;
  const diff=Math.floor((new Date(date)-new Date(lastBleed))/86400000)+5;
  if(diff<1)return null;
  return((diff-1)%(len||28))+1;
}
function getPhaseForDate(date,lastBleed,len){
  const d=getCycleDayForDate(date,lastBleed,len);
  if(!d)return null;
  return PHASES_SC.find(p=>d>=p.r[0]&&d<=p.r[1])||PHASES_SC[3];
}
function suggestSession(sessions,phase){
  if(!phase||!sessions||!sessions.length)return '';
  const k=phase.k;
  if(k==='menstrual'){const s=sessions.find(x=>/suave/i.test(x.session_type)&&!/abdomen/i.test(x.session_type));return s?s.id:'';}
  if(k==='folicular'){const s=sessions.find(x=>/principal.*tren inf/i.test(x.session_type));return s?s.id:'';}
  if(k==='ovulatoria'){const s=sessions.find(x=>/cuerpo completo|integrad/i.test(x.session_type));return s?s.id:'';}
  if(k==='lutea'){const s=sessions.find(x=>/suave/i.test(x.session_type)&&!/abdomen/i.test(x.session_type));return s?s.id:'';}
  return '';
}
function getDaysInMonth(year,month){
  const days=[];const d=new Date(year,month,1);
  while(d.getMonth()===month){days.push(new Date(d));d.setDate(d.getDate()+1);}
  return days;
}
const MONTHS_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS_ES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

        <button onclick="changeMonth(1)" style="background:#f3f4f6;border:none;padding:8px 14px;border-radius:9px;font-weight:700">→</button>

      <div style="display:flex;gap:8px;margin-bottom:12px">

      ${days.map(day=>{

        const phase=getPhaseForDate(dateStr,lastBleed,cycleLen);

function adminMapearFaseLunar(dia,dur){
  if(dur<22||dur>40)return{fase:'menguante_b',orden:1};
  const r={
    luna_nueva:[1,5],creciente:[6,dur-15],llena:[dur-14,dur-12],
    menguante_a:[dur-11,dur-5],menguante_b:[dur-4,dur]
  };
  const mx={luna_nueva:5,creciente:8,llena:3,menguante_a:7,menguante_b:5};
  const fases=Object.keys(r);for(let fi=0;fi<fases.length;fi++){const f=fases[fi];const ini=r[f][0];const fin=r[f][1];
    if(dia>=ini&&dia<=fin){return{fase:f,orden:((dia-ini)%mx[f])+1};}}
  return{fase:'menguante_b',orden:1};
}

function calcMotorPhase(perfil,fecha){
  if(!perfil||!perfil.ancla)return null;
  const ancla=new Date(perfil.ancla+'T00:00:00');
  const hoy=new Date(fecha+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  if(perfil.ruta==='energia'){
    const db=(dias%28)+1;
    const semana=Math.ceil(db/7);
    return{fase:'semana_'+semana,dia:db,orden:((db-1)%7)+1};
  }
  const dur=perfil.duracion_ciclo||28;
  let diaCiclo=dias+1;
  if(diaCiclo>dur){
    return{fase:'menguante_b',dia:dur,orden:(((diaCiclo-dur)-1)%5)+1};
  }
  const r=adminMapearFaseLunar(diaCiclo,dur);
  return{fase:r.fase,dia:diaCiclo,orden:r.orden};
}

function buildStrip(perfil){
  const strip=[];
  for(let d=1;d<=30;d++){
    const fecha='2026-09-'+String(d).padStart(2,'0');
    const r=calcMotorPhase(perfil,fecha);
    strip.push({d,fecha,motor:r});
  }
  return strip;
}

async function loadMotorClient(clientId){
  set({motorLoading:true});
  const c=S.clients.find(x=>x.id===clientId);
  // Load extended profile (motor fields)
  const[profR,schedR]=await Promise.all([
    sb.from('profiles').select('ruta,sub_perfil,ancla,duracion_ciclo,nivel').eq('id',clientId).single(),
    sb.from('scheduled_sessions').select('*,sessions(session_type)').eq('client_id',clientId)
      .gte('scheduled_date','2026-09-01').lte('scheduled_date','2026-09-30').order('scheduled_date'),
  ]);
  const perfil=Object.assign({},c,profR.data||{});
  const schedMap={};
  (schedR.data||[]).forEach(function(r){schedMap[r.scheduled_date]=r;});
  // Build 30 rows
  const DIAS_ES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const rows=[];
  for(let d=1;d<=30;d++){
    const fecha='2026-09-'+String(d).padStart(2,'0');
    const dt=new Date(fecha+'T12:00:00');
    const diaSem=DIAS_ES[dt.getDay()];
    const sched=schedMap[fecha]||null;
    const motor=calcMotorPhase(perfil,fecha);
    rows.push({d,fecha,diaSem,sched,motor});
  }
  set({motorLoading:false,motorClient:{perfil,rows}});
}

async function doAddClient(){
  const name  = document.getElementById('ac-name')?.value?.trim();
  const email = document.getElementById('ac-email')?.value?.trim();
  const pass  = document.getElementById('ac-pass')?.value?.trim();
  const plan  = document.getElementById('ac-plan')?.value;
  const ruta  = document.getElementById('ac-ruta')?.value;
  const sub   = document.getElementById('ac-sub')?.value||null;
  const nivel = parseInt(document.getElementById('ac-nivel')?.value)||2;
  const dur   = parseInt(document.getElementById('ac-dur')?.value)||28;
  const ancla = document.getElementById('ac-ancla')?.value||null;
  const esc   = document.getElementById('ac-esc')?.value||'C';
  const dias  = document.getElementById('ac-dias')?.value?.trim();
  const diasArr = dias?dias.split(',').map(d=>d.trim()).filter(Boolean):null;

  if(!name||!email||!pass){
    set({pForm:{...(S.pForm||{}),error:'Nombre, correo y contraseña son obligatorios.'}});return;
  }
  if(!ruta){
    set({pForm:{...(S.pForm||{}),error:'Selecciona la ruta (lunar o energía).'}});return;
  }
  set({loading:true,pForm:{...(S.pForm||{}),error:'',ok:''}});

  try {
    // 1. Create auth user via admin API (uses service role or admin endpoint)
    // Supabase JS client createUser is only in service role SDK
    // We use signUp + immediate confirmation via update
    const {data:authData, error:authErr} = await sb.auth.admin
      ? await sb.auth.admin.createUser({email, password:pass, email_confirm:true})
      : {data:null, error:{message:'Admin API no disponible en cliente anon'}};

    if(authErr){
      // Fallback: use signUp and confirm manually
      const {data:signData, error:signErr} = await sb.auth.signUp({email,password:pass});
      if(signErr) throw new Error(signErr.message);
      const uid = signData?.user?.id;
      if(!uid) throw new Error('No se obtuvo el ID del usuario');
      // Confirm email via profiles update (anon key can't confirm, but profile insert works)
      await sb.from('profiles').upsert({
        id:uid, name, plan, ruta,
        sub_perfil:sub||null, nivel, duracion_ciclo:dur,
        ancla:ancla||null, escenario_default:esc,
        dias_presenciales:diasArr||null
      });
      set({loading:false,pForm:{name:'',email:'',pass:'',ruta:'',plan:'presencial',error:'',
        ok:'✅ Cuenta creada. Pídele a '+name+' que confirme su correo antes de entrar, o confirma el email manualmente en Supabase > Authentication > Users.'}});
    } else {
      const uid = authData?.user?.id;
      if(uid){
        await sb.from('profiles').upsert({
          id:uid, name, plan, ruta,
          sub_perfil:sub||null, nivel, duracion_ciclo:dur,
          ancla:ancla||null, escenario_default:esc,
          dias_presenciales:diasArr||null
        });
      }
      set({loading:false,pForm:{name:'',email:'',pass:'',ruta:'',plan:'presencial',error:'',
        ok:'✅ Clienta creada y correo confirmado automáticamente. Ya puede entrar a la app.'}});
    }
    // Reload client list
    await loadData();
  } catch(e){
    set({loading:false,pForm:{...(S.pForm||{}),error:'Error: '+e.message}});
  }
}


// ── SCHEDULE ACTIONS ─────────────────────────────────────────
async function openSchedule(clientId){
  const c=S.clients.find(x=>x.id===clientId)||S.selClient;
  set({loading:true});
  const [schedR,cycR,progR]=await Promise.all([
    sb.from('scheduled_sessions').select('*').eq('client_id',clientId).gte('scheduled_date',new Date(S.scheduleYear,S.scheduleMonth,1).toISOString().split('T')[0]).lte('scheduled_date',new Date(S.scheduleYear,S.scheduleMonth+1,0).toISOString().split('T')[0]),
    sb.from('cycle_logs').select('*').eq('client_id',clientId).order('created_at',{ascending:false}).limit(3),
    sb.from('client_programs').select('program_id').eq('client_id',clientId).maybeSingle(),
  ]);
  let sessions=[];
  if(progR.data?.program_id){
    const sessR=await sb.from('sessions').select('id,session_type').eq('program_id',progR.data.program_id).order('week_number').order('day_number');
    sessions=[...new Map((sessR.data||[]).map(s=>[s.session_type,s])).values()];
  }
  const schedule={};
  (schedR.data||[]).forEach(r=>{if(r.session_id)schedule[r.scheduled_date]=r.session_id;else schedule[r.scheduled_date]='rest';});
  set({loading:false,view:'schedule',selClient:c,clientCycle:cycR.data||[],scheduleSessions:sessions,clientSchedule:schedule});
}
function setScheduleDay(date,sessionId){
  const sch={...S.clientSchedule};
  if(sessionId===''||sessionId===undefined)delete sch[date];
  else sch[date]=sessionId;
  S.clientSchedule=sch;
}
function changeMonth(dir){
  let m=S.scheduleMonth+dir,y=S.scheduleYear;
  if(m>11){m=0;y++;}if(m<0){m=11;y--;}
  S.scheduleMonth=m;S.scheduleYear=y;
  if(S.selClient)openSchedule(S.selClient.id);
}
function autoFill(){
  const lastBleed=S.clientCycle[0]?.last_bleeding_date||null;
  const cycleLen=S.clientCycle[0]?.cycle_length||28;
  const days=getDaysInMonth(S.scheduleYear,S.scheduleMonth);
  const sessions=S.scheduleSessions.filter(s=>!/abdomen/i.test(s.session_type));
  const sch={...S.clientSchedule};
  let dayCount=0;
  days.forEach(day=>{
    const dateStr=day.toISOString().split('T')[0];
    const dayOfWeek=day.getDay();
    // Skip if already assigned
    if(sch[dateStr])return;
    // Only assign Mon, Wed, Fri (1,3,5) as default training days
    if(dayOfWeek===1||dayOfWeek===3||dayOfWeek===5){
      const phase=getPhaseForDate(dateStr,lastBleed,cycleLen);
      const suggested=suggestSession(sessions,phase);
      if(suggested)sch[dateStr]=suggested;
    }
  });
  S.clientSchedule=sch;
  render();
}
async function saveSchedule(){
  if(!S.selClient)return;
  const clientId=S.selClient.id;
  const upserts=Object.entries(S.clientSchedule).map(([date,sessId])=>({
    client_id:clientId,
    scheduled_date:date,
    session_id:sessId==='rest'?null:sessId,
    status:sessId==='rest'?'rest':'pending',
  }));
  if(upserts.length===0){alert('No hay cambios que guardar.');return;}
  set({loading:true});
  await sb.from('scheduled_sessions').upsert(upserts,{onConflict:'client_id,scheduled_date'});
  set({loading:false});
  alert('✅ Mes guardado correctamente');
}



async function loadData(){
  set({loading:true});
  const[clientsR,progsR]=await Promise.all([
    sb.from('profiles').select('*').neq('name',null).order('name'),
    sb.from('programs').select('*').order('name'),
  ]);
  const clients=(clientsR.data||[]).map(function(p){
    const cp=null; // will load per client
    return Object.assign({},p,{prog_id:null,prog_name:null});
  });
  // Load client_programs for all clients
  const cpR=await sb.from('client_programs').select('client_id,program_id,programs(name)');
  const cpMap={};
  (cpR.data||[]).forEach(function(r){
    cpMap[r.client_id]={prog_id:r.program_id,prog_name:r.programs?r.programs.name:''};
  });
  const clientsWithProg=clients.map(function(c){
    return Object.assign({},c,cpMap[c.id]||{});
  });
  set({loading:false,clients:clientsWithProg,programs:progsR.data||[]});
}

  if(S.eForm.id){
    await sb.from('exercises').update(data).eq('id',S.eForm.id);
  } else {
    await sb.from('exercises').insert(data);
  }
  set({eForm:{show:false,name:'',muscle:'',sets:3,reps:'8-10',video:'',bloque:'',carga_pct:'',carga_kg:'',tempo:'',cue:''}});
  await openSess(sessId);
}

async function updateVideo(exId,url,sessId){
  await sb.from('exercises').update({video_url:url}).eq('id',exId);
  if(sessId)await openSess(sessId);
}

async function delEx(id,sessId){
  if(!confirm('¿Eliminar este ejercicio?'))return;
  await sb.from('exercises').delete().eq('id',id);
  if(sessId)await openSess(sessId);
}

async function doLogin(){
  const email=(document.getElementById('le')||{}).value||'';
  const pass=(document.getElementById('lp')||{}).value||'';
  if(!email||!pass){set({error:'Ingresa correo y contraseña.'});return;}
  set({loading:true,error:''});
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){set({loading:false,error:error.message});return;}
  const{data:{user}}=await sb.auth.getUser();
  if(!user||user.email!=='brayanpedrazatrainer@gmail.com'){
    await sb.auth.signOut();
    set({loading:false,error:'No tienes acceso de administrador.'});
    return;
  }
  set({loading:false,user,view:'main',error:''});
  await loadData();
}

async function logout(){
  await sb.auth.signOut();
  set({view:'login',user:null,clients:[],programs:[],error:''});
}


function limpiarNombre(s){
  return (s||'').replace(/[\u{1F300}-\u{1FFFF}\u{2600}-\u{27BF}]/gu,'').replace(/[⚡⚠📅🌑🌓🌕🌗🌘💪🔥🛡]/g,'').trim();
}
window.set=set;window.doLogin=doLogin;window.logout=logout;window.loadData=loadData;
window.openClient=openClient;window.loadMotorClient=loadMotorClient;window.doAddClient=doAddClient;window.editEx=editEx;window.assignProg=assignProg;window.openSchedule=openSchedule;window.setScheduleDay=setScheduleDay;window.changeMonth=changeMonth;window.autoFill=autoFill;window.saveSchedule=saveSchedule;window.openProg=openProg;window.openSess=openSess;
window.saveProgram=saveProgram;window.delProg=delProg;window.saveSession=saveSession;window.delSess=delSess;
window.saveExercise=saveExercise;window.updateVideo=updateVideo;window.delEx=delEx;

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){S.user=session.user;await loadData();}
  else render();
}
init();
</script>
