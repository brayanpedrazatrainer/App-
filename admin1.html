// ── ACCESO Y PAGO ───────────────────────────────────────────
// estado 'pausada' = la clienta ve una pantalla de pausa. pagado_hasta = último día pagado:
// la app le avisa desde 5 días antes y cuando vence, pero no la bloquea sola.
function hoyLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function diasParaVencer(f){if(!f)return null;return Math.round((new Date(String(f).slice(0,10)+'T12:00:00')-new Date(hoyLocal()+'T12:00:00'))/86400000)}
function fechaCorta(f){return f?new Date(String(f).slice(0,10)+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'}):''}
function badgeAcceso(c){
  const pill=(t,bg,col)=>`<span style="font-size:10px;font-weight:800;border-radius:20px;padding:3px 9px;background:${bg};color:${col};white-space:nowrap">${t}</span>`;
  if(c.estado==='pausada')return pill('⏸ Pausada','#e5e7eb','#374151');
  const d=diasParaVencer(c.pagado_hasta);
  if(d===null)return pill('Sin fecha de pago','#f3f4f6',C.g2);
  if(d<0)return pill('Venció hace '+(-d)+' d','#fde8e8','#b91c1c');
  if(d<=5)return pill(d===0?'Vence hoy':'Vence en '+d+' d','#fef3c7','#92400e');
  return pill('Al día','#dcfce7','#166534');
}
function rAcceso(c){
  const pausada=c.estado==='pausada';
  const d=diasParaVencer(c.pagado_hasta);
  const btn=(on,t,fn,col)=>`<button onclick="${fn}" style="flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:13px;border:2px solid ${on?col:C.g3};background:${on?col:C.wh};color:${on?'#fff':C.g2}">${t}</button>`;
  return`<div style="background:${C.wh};border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><p style="font-weight:800;font-size:15px">💳 Acceso y pago</p>${badgeAcceso(c)}</div>
    <p style="font-size:12px;color:${C.g2};font-weight:600;margin-bottom:6px">Estado</p>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      ${btn(!pausada,'✅ Activa',`setEstado('${c.id}','activa')`,'#16a34a')}
      ${btn(pausada,'⏸ Pausada',`setEstado('${c.id}','pausada')`,'#374151')}
    </div>
    <p style="font-size:12px;color:${C.g2};font-weight:600;margin-bottom:6px">Pagado hasta ${c.pagado_hasta?'· '+fechaCorta(c.pagado_hasta)+(d<0?' (venció)':d===0?' (hoy)':' (faltan '+d+' días)'):''}</p>
    <div style="display:flex;gap:8px">
      <input id="pago-fecha" type="date" value="${c.pagado_hasta||''}" style="flex:1;padding:9px 10px;border:2px solid ${C.g3};border-radius:10px;font-size:14px"/>
      <button onclick="guardarPago('${c.id}',document.getElementById('pago-fecha').value)" style="padding:9px 14px;background:${C.bk};color:#fff;border:none;border-radius:10px;font-weight:700;font-size:13px">Guardar</button>
    </div>
    <button onclick="sumarMes('${c.id}')" style="width:100%;margin-top:8px;padding:10px;background:${C.pr};color:#fff;border:none;border-radius:10px;font-weight:700;font-size:13px">+1 mes (renovó)</button>
    <p style="font-size:11px;color:${C.g2};margin-top:8px;line-height:1.5">La clienta ve un aviso desde 5 días antes de la fecha. Si vence, sigue entrando; solo se bloquea si la pones en Pausada.</p>
  </div>`;
}
async function actualizarAcceso(id,cambios){
  const r=await sb.from('profiles').update(cambios).eq('id',id).select('id,estado,pagado_hasta').maybeSingle();
  if(r.error||!r.data){alert('No se pudo guardar: '+((r.error&&r.error.message)||'sin permiso'));return;}
  const clients=S.clients.map(function(x){return x.id===id?Object.assign({},x,r.data):x;});
  set({clients:clients,selClient:S.selClient&&S.selClient.id===id?Object.assign({},S.selClient,r.data):S.selClient});
}
function setEstado(id,estado){
  const c=S.clients.find(function(x){return x.id===id;});
  if(estado==='pausada'&&!confirm('¿Pausar a '+(c?c.name:'esta clienta')+'? No podrá ver sus rutinas hasta que la actives.'))return;
  actualizarAcceso(id,{estado:estado});
}
function guardarPago(id,fecha){actualizarAcceso(id,{pagado_hasta:fecha||null});}
function sumarMes(id){
  const c=S.clients.find(function(x){return x.id===id;});
  const hoy=hoyLocal();
  const base=c&&c.pagado_hasta&&c.pagado_hasta>hoy?c.pagado_hasta:hoy;
  const d=new Date(base+'T12:00:00');const dia=d.getDate();d.setMonth(d.getMonth()+1);
  if(d.getDate()!==dia)d.setDate(0); // 31 ene + 1 mes = 28/29 feb, no 3 mar
  const nueva=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  actualizarAcceso(id,{pagado_hasta:nueva,estado:'activa'});
}

// ── NIVEL Y ASISTENCIA (motor adaptativo, Brayan 2026-10-27) ─
// "Entrenado" = sesión marcada como completada (ella en la app o Brayan con "Asistió").
// Nivel: 1→2 con 20 sesiones de fuerza (Principal o Integradora) en 60 días; 2→3 con 40 en 120 días;
// 14 días sin entrenar → bajar uno. La app sugiere y Brayan aprueba.
const NIVELES={1:'Principiante',2:'Intermedia',3:'Avanzada'};
const MOTOR_DESDE_A='2026-10-26';
const AJUSTE_TXT={rojo:'semáforo rojo',amarillo:'amarillo / días 1–2',encendida:'subió por "Encendida"',recuperacion_4:'4.º día seguido → recuperación',
  vuelta_media:'volvió tras días sin entrenar',vuelta_larga:'volvió tras 8+ días',sin_entreno_recup:'sin entrenar → media',freno:'freno de la semana',peri_freno:'freno peri/menopausia'};
async function loadClientHist(id){
  try{
    const h=await sb.from('scheduled_sessions').select('id,scheduled_date,status,session_id,session_original,ajuste,session_mode')
      .eq('client_id',id).gte('scheduled_date',fechaMas(hoyLocal(),-120)).lte('scheduled_date',hoyLocal()).order('scheduled_date',{ascending:false});
    const ids=[];(h.data||[]).forEach(function(r){[r.session_id,r.session_original].forEach(function(x){if(x&&ids.indexOf(x)<0)ids.push(x);});});
    const s=ids.length?await sb.from('sessions').select('id,session_type').in('id',ids):{data:[]};
    const tipos={};(s.data||[]).forEach(function(x){tipos[x.id]=x.session_type||'';});
    if(S.selClient&&S.selClient.id===id)set({clientHist:{filas:h.data||[],tipos:tipos}});
  }catch(e){console.error(e);}
}
function rProgreso(c){
  const H=S.clientHist;
  const nivel=c.nivel||2;
  let h=`<div style="background:${C.wh};border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><p style="font-weight:800;font-size:15px">📈 Nivel y asistencia</p>
    <select onchange="cambiarNivel('${c.id}',+this.value)" style="padding:6px 8px;border:2px solid ${C.g3};border-radius:8px;font-size:13px">${[1,2,3].map(n=>`<option value="${n}" ${n===nivel?'selected':''}>Nivel ${n} · ${NIVELES[n]}</option>`).join('')}</select></div>`;
  if(!H)return h+`<p style="font-size:13px;color:${C.g2}">Cargando…</p></div>`;
  const esFuerza=r=>/principal|integradora/i.test(H.tipos[r.session_id]||'');
  const hechas=H.filas.filter(r=>r.status==='completed');
  const f60=hechas.filter(r=>esFuerza(r)&&r.scheduled_date>=fechaMas(hoyLocal(),-60)).length;
  const f120=hechas.filter(r=>esFuerza(r)).length;
  let ultima=MOTOR_DESDE_A;hechas.forEach(r=>{if(r.scheduled_date>ultima)ultima=r.scheduled_date;});
  const sin=Math.max(0,Math.round((new Date(hoyLocal()+'T12:00:00')-new Date(ultima+'T12:00:00'))/86400000));
  h+=`<p style="font-size:12.5px;color:${C.g2};line-height:1.6">Sesiones de fuerza completadas: <b style="color:#191211">${f60}</b> en 60 días · <b style="color:#191211">${f120}</b> en 120 días · ${sin>1?sin+' días sin entrenar':'entrenó hace poco'}</p>`;
  let sug=null;
  if(nivel>1&&sin>=14)sug={n:nivel-1,t:`Lleva ${sin} días sin entrenar: sugerencia bajar a nivel ${nivel-1}.`};
  else if(nivel===1&&f60>=20)sug={n:2,t:`Lista para nivel 2: ${f60} sesiones de fuerza en 60 días.`};
  else if(nivel===2&&f120>=40)sug={n:3,t:`Lista para nivel 3: ${f120} sesiones de fuerza en 120 días.`};
  else h+=`<p style="font-size:12px;color:${C.g2};margin-top:2px">${nivel===1?'Para nivel 2: 20 sesiones de fuerza en 60 días.':nivel===2?'Para nivel 3: 40 sesiones de fuerza en 120 días.':'Nivel máximo.'}</p>`;
  if(sug)h+=`<div style="margin-top:8px;padding:10px 12px;border-radius:10px;background:#fef3c7;display:flex;justify-content:space-between;align-items:center;gap:8px"><p style="font-size:12.5px;font-weight:700;color:#92400e">${sug.t}</p>
    <button onclick="cambiarNivel('${c.id}',${sug.n})" style="padding:8px 12px;background:${C.bk};color:#fff;border:none;border-radius:9px;font-weight:700;font-size:12px;white-space:nowrap">Aprobar</button></div>`;
  // Últimos 14 días con "Asistió"
  h+=`<p style="font-size:12px;font-weight:800;margin:12px 0 4px">Últimos 14 días</p>`;
  H.filas.filter(r=>r.scheduled_date>=fechaMas(hoyLocal(),-13)).forEach(r=>{
    const hecha=r.status==='completed',d=new Date(r.scheduled_date+'T12:00:00');
    const tipo=(H.tipos[r.session_id]||'').split(' —')[0]||'—';
    const aj=r.ajuste&&AJUSTE_TXT[r.ajuste]?`<span style="font-size:10.5px;color:#8A6A22;background:#fdf0c8;border-radius:20px;padding:1px 7px;margin-left:4px">${AJUSTE_TXT[r.ajuste]}</span>`:'';
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #eee">
      <div style="min-width:0"><p style="font-size:12.5px;font-weight:700">${d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'})}${r.session_mode==='Con Brayan'?' · Con Brayan':''}</p><p style="font-size:11.5px;color:${C.g2}">${esc(tipo)}${aj}</p></div>
      <button onclick="marcarAsistencia('${r.id}',${!hecha})" style="padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap;border:${hecha?'none':'1px solid '+C.g3};background:${hecha?'#16a34a':'#fff'};color:${hecha?'#fff':'#191211'}">${hecha?'✓ Asistió':'Asistió'}</button></div>`;
  });
  return h+'</div>';
}
async function marcarAsistencia(rowId,hecha){
  const r=await sb.from('scheduled_sessions').update({status:hecha?'completed':'pending'}).eq('id',rowId);
  if(r.error){alert('No se pudo guardar: '+r.error.message);return;}
  if(S.selClient)loadClientHist(S.selClient.id);
}
async function cambiarNivel(id,n){
  const r=await sb.from('profiles').update({nivel:n}).eq('id',id).select('id,nivel').maybeSingle();
  if(r.error||!r.data){alert('No se pudo cambiar el nivel: '+((r.error&&r.error.message)||'sin permiso'));return;}
  const clients=S.clients.map(function(x){return x.id===id?Object.assign({},x,r.data):x;});
  set({clients:clients,selClient:Object.assign({},S.selClient,r.data)});
}

// ── CLASES EN VIVO (inscripciones de Compañía/Corona) ───────
// Horario semanal (clases_horario) e inscripciones (clases_inscripciones). Las clientas se inscriben desde la app
// (máx. 3 por semana); aquí Brayan ve quiénes asistirán y maneja horario y link de cada clase.
const DIAS_CL=[{k:'lun',l:'Lunes'},{k:'mar',l:'Martes'},{k:'mie',l:'Miércoles'},{k:'jue',l:'Jueves'},{k:'vie',l:'Viernes'},{k:'sab',l:'Sábado'},{k:'dom',l:'Domingo'}];
function horaBonitaA(h){const p=String(h||'').split(':'),H=+p[0];return (H%12||12)+':'+(p[1]||'00')+(H<12?' a. m.':' p. m.');}
function fechaMas(f,d){const x=new Date(f+'T12:00:00');x.setDate(x.getDate()+d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
async function loadClasesAdmin(){
  try{
    const h=await sb.from('clases_horario').select('*').order('hora');

    set({clasesAdmin:{horario:h.data||[],ins:i.data||[]}});
  }catch(e){console.error(e);}
}

    <button onclick="loadClasesAdmin()" style="background:#f3f4f6;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700">↻ Actualizar</button></div>`;

  for(let d=0;d<14;d++){
    const f=fechaMas(hoyLocal(),d),dia=ab[new Date(f+'T12:00:00').getDay()];
    activos.filter(x=>x.dia===dia).forEach(x=>{

          <p style="font-weight:800;font-size:14px">📡 ${dd.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'})} · ${horaBonitaA(x.hora)} · En vivo semanal</p>
          <p style="font-size:12.5px;color:${C.g2};margin-top:4px">Incluido en Premium y VIP · sin inscripción</p></div>`;
        return;
      }
      h+=`<div style="background:${C.wh};border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid ${ins.length?C.pr:'#e5e7eb'}">

        <span style="font-size:12px;font-weight:800;color:${ins.length?C.pr:C.g2}">${ins.length} inscrita${ins.length!==1?'s':''}${x.cupo?' / '+x.cupo:''}</span></div>
        <p style="font-size:12.5px;color:${ins.length?'#191211':C.g2};margin-top:4px">${ins.length?ins.map(i=>esc(nombre(i.client_id))).join(' · '):'Nadie inscrita aún'}</p></div>`;
    });

  if(!hay)h+=`<p style="font-size:13px;color:${C.g2};margin-bottom:12px">No hay clases activas en los próximos 14 días.</p>`;
  h+=`<p style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:${C.g2};margin:18px 0 8px">Tu horario semanal</p>
    <div style="background:${C.wh};border-radius:14px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)">
    <p style="font-size:12px;color:${C.g2};margin-bottom:10px;line-height:1.5">Todas usan tu link fijo de Meet; si quieres otro para una clase, cámbialo aquí. Las clientas lo ven el día de la clase. <b>Corrección</b>: con inscripción, máximo 2 por semana por clienta; la inscripción cierra 10 horas antes (6 a. m. → 8 p. m. del día anterior). <b>En vivo semanal</b>: lo programas tú; viene en Premium y VIP, sin inscripción.</p>`;
  K.horario.slice().sort((a,b)=>orden.indexOf(a.dia)-orden.indexOf(b.dia)||String(a.hora).localeCompare(String(b.hora))).forEach(x=>{
    const dl=(DIAS_CL.find(d=>d.k===x.dia)||{}).l||x.dia;
    h+=`<div style="padding:10px 0;border-bottom:1px solid #eee;${x.activo?'':'opacity:.5'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><p style="font-weight:800;font-size:14px">${dl} · ${horaBonitaA(x.hora)} <span style="font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;background:${x.tipo==='en_vivo'?'#fdf0c8':'#f3f4f6'};color:${x.tipo==='en_vivo'?'#8A6A22':C.g2}">${x.tipo==='en_vivo'?'📡 En vivo semanal':'Corrección'}</span></p>

  });
  h+=`<p style="font-weight:700;font-size:13px;margin:12px 0 6px">Agregar una clase</p>

    <input id="nh-hora" type="time" value="06:00" style="width:110px;padding:8px;border:2px solid ${C.g3};border-radius:9px;font-size:13px"/></div>

    <button onclick="agregarHorario()" style="padding:9px 12px;background:${C.pr};color:#fff;border:none;border-radius:9px;font-weight:700;font-size:12px">Agregar</button></div></div>`;
  return h;
}
async function guardarLinkHorario(id){
  const v=(document.getElementById('hl-'+id)||{}).value||'';
  const r=await sb.from('clases_horario').update({link:v.trim()||null}).eq('id',id);
  if(r.error){alert('No se pudo guardar: '+r.error.message);return;}
  await loadClasesAdmin();alert('✅ Link guardado');
}
async function activarHorario(id,activo){
  const r=await sb.from('clases_horario').update({activo:activo}).eq('id',id);
  if(r.error){alert('No se pudo cambiar: '+r.error.message);return;}
  loadClasesAdmin();
}
async function agregarHorario(){
  const dia=document.getElementById('nh-dia').value,hora=document.getElementById('nh-hora').value;
  if(!hora){alert('Escribe la hora.');return;}
  const tipo=(document.getElementById('nh-tipo')||{}).value||'correccion';
  const r=await sb.from('clases_horario').insert({dia:dia,hora:hora,tipo:tipo});
  if(r.error){alert(/duplicate|unique/i.test(r.error.message)?'Esa clase ya existe.':'No se pudo agregar: '+r.error.message);return;}
  loadClasesAdmin();
}

const DIAS_ABR=['dom','lun','mar','mie','jue','vie','sab'];
const FASE_SESION_MAP={
  luna_nueva:'suave',creciente:'principal',llena:'integradora',
  menguante_a:'integradora',menguante_b:'suave',
  semana_1:'principal',semana_2:'principal',semana_3:'integradora',semana_4:'suave'
};

function esDiaPresencial(fecha, diasPres){
  if(!diasPres||!diasPres.length)return false;
  const d=new Date(fecha+'T12:00:00');
  const abr=DIAS_ABR[d.getDay()];
  return diasPres.some(function(x){return x.toLowerCase().replace('é','e').replace('á','a')===abr;});
}

async function generarMes(){
  const mc=S.motorClient;
  if(!mc||!mc.perfil){alert('Selecciona una clienta primero.');return;}
  const perfil=mc.perfil;
  if(!perfil.ancla){alert('Esta clienta no tiene ancla.');return;}
  set({loading:true});
  try{
    const DL=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const days=getDaysInMonth(S.scheduleYear,S.scheduleMonth);
    const ruta=perfil.ruta||'lunar';

    let tarjetas=[];
    const plR=await sb.from('plantillas').select('id').eq('ruta',ruta).eq('activa',true);
    const pids=((plR&&plR.data)||[]).map(function(x){return x.id;});
    if(pids.length){
      const ptR=await sb.from('plantilla_tarjetas').select('fase,orden,session_id').in('plantilla_id',pids);
      tarjetas=(ptR&&ptR.data)||[];
    }

    const sesIds=tarjetas.map(function(t){return t.session_id;}).filter(Boolean);
    const nameMap={};
    if(sesIds.length){
      const sR=await sb.from('sessions').select('id,session_type').in('id',sesIds);
      ((sR&&sR.data)||[]).forEach(function(s){nameMap[s.id]=s.session_type;});
    }

    const rows=[];
    days.forEach(function(day){
      const fecha=day.toISOString().split('T')[0];
      const motor=calcMotorPhase(perfil,fecha);
      const modo=esDiaPresencial(fecha,perfil.dias_presenciales)?'Con Brayan':'Sesión Reina';
      let sesId='',sesNombre='';
      if(motor){
        const t=tarjetas.find(function(x){return x.fase===motor.fase&&Number(x.orden)===Number(motor.orden);});
        if(t&&t.session_id){sesId=t.session_id;sesNombre=nameMap[t.session_id]||'Sesión';}
      }
      rows.push({fecha,d:day.getDate(),diaSem:DL[day.getDay()],motor,modo,sesId,sesNombre,editedSesId:sesId});
    });
    set({loading:false,genRows:rows,genState:'idle'});
  }catch(err){
    set({loading:false});
    alert('Error: '+(err&&err.message?err.message:JSON.stringify(err)));
  }
}

async function saveGeneratedRows(){
  const mc=S.motorClient;if(!mc)return;
  const clientId=mc.perfil.id;
  const year=S.scheduleYear,month=S.scheduleMonth;
  const firstDay=new Date(year,month,1).toISOString().split('T')[0];
  const lastDay=new Date(year,month+1,0).toISOString().split('T')[0];
  // Check existing
  const exR=await sb.from('scheduled_sessions').select('id,scheduled_date').eq('client_id',clientId).gte('scheduled_date',firstDay).lte('scheduled_date',lastDay);
  const existing=exR.data||[];
  if(existing.length>0&&S.genState==='idle'){
    set({genState:'conflict',genConflictCount:existing.length});return;
  }
  set({loading:true});
  const rows=S.genRows.filter(function(r){return r.editedSesId;});
  if(S.genState==='overwrite'||S.genState==='conflict'&&existing.length>0){
    await sb.from('scheduled_sessions').delete().eq('client_id',clientId).gte('scheduled_date',firstDay).lte('scheduled_date',lastDay);
  }
  const toInsert=rows.map(function(r){
    if(S.genState==='skip'){
      const exists=existing.find(function(e){return e.scheduled_date===r.fecha;});
      if(exists)return null;
    }
    // Si Brayan cambió la sesión a mano, la fila queda 'manual' y el período no la recalcula
    return{client_id:clientId,scheduled_date:r.fecha,session_id:r.editedSesId,status:'pending',session_mode:r.modo,origen:r.editedSesId===r.sesId?'motor':'manual'};
  }).filter(Boolean);
  if(toInsert.length>0)await sb.from('scheduled_sessions').insert(toInsert);
  set({loading:false,genState:'saved',genConflictCount:0});
  alert('✅ '+toInsert.length+' sesiones guardadas para '+(MONTHS_ES[month])+' '+year);
}

async function borrarMes(){
  const mc=S.motorClient;if(!mc)return;
  if(!confirm('¿Borrar TODAS las sesiones programadas de este mes para '+mc.perfil.name+'? No se puede deshacer.'))return;
  const year=S.scheduleYear,month=S.scheduleMonth;
  const firstDay=new Date(year,month,1).toISOString().split('T')[0];
  const lastDay=new Date(year,month+1,0).toISOString().split('T')[0];
  set({loading:true});
  await sb.from('scheduled_sessions').delete().eq('client_id',mc.perfil.id).gte('scheduled_date',firstDay).lte('scheduled_date',lastDay);
  set({loading:false,genRows:[],genState:'idle'});
  alert('🗑 Mes borrado.');
}

async function loadMotorClient(clientId){
  set({loading:true});
  try{
    const c=(S.clients||[]).find(function(x){return x.id===clientId;})||{};
    const y=S.scheduleYear, m=S.scheduleMonth;
    const firstD=new Date(y,m,1).toISOString().split('T')[0];
    const lastD=new Date(y,m+1,0).toISOString().split('T')[0];

    const profR=await sb.from('profiles').select('*').eq('id',clientId).maybeSingle();
    const perfil=Object.assign({},c,(profR&&profR.data)||{});

    let schedRows=[];
    try{
      const sR=await sb.from('scheduled_sessions').select('*,sessions(id,session_type)').eq('client_id',clientId).gte('scheduled_date',firstD).lte('scheduled_date',lastD);
      schedRows=(sR&&sR.data)||[];
    }catch(e){schedRows=[];}
    const schedule={};
    schedRows.forEach(function(r){schedule[r.scheduled_date]=r;});

    let sessions=[];
    try{
      const cpR=await sb.from('client_programs').select('program_id').eq('client_id',clientId).maybeSingle();
      if(cpR&&cpR.data&&cpR.data.program_id){
        const sessR=await sb.from('sessions').select('id,session_type').eq('program_id',cpR.data.program_id).order('week_number').order('day_number');
        sessions=Array.from(new Map(((sessR&&sessR.data)||[]).map(function(s){return [s.session_type,s];})).values());
      }
    }catch(e){}
    if(!sessions.length){
      try{
        const plR2=await sb.from('plantillas').select('id').eq('ruta',perfil.ruta||'lunar').eq('activa',true);
        const pids2=((plR2&&plR2.data)||[]).map(function(x){return x.id;});
        if(pids2.length){
          const ptR=await sb.from('plantilla_tarjetas').select('session_id').in('plantilla_id',pids2);
          const ids=Array.from(new Set(((ptR&&ptR.data)||[]).map(function(t){return t.session_id;}).filter(Boolean)));
          if(ids.length){
            const sR2=await sb.from('sessions').select('id,session_type').in('id',ids);
            sessions=(sR2&&sR2.data)||[];
          }
        }
      }catch(e){}
    }
    if(!sessions.length){
      try{
        const allS=await sb.from('sessions').select('id,session_type').limit(200);
        sessions=Array.from(new Map(((allS&&allS.data)||[]).map(function(s){return [s.session_type,s];})).values());
      }catch(e){}
    }

    let cycles=[];
    try{
      const cR=await sb.from('cycle_logs').select('*').eq('client_id',clientId).order('created_at',{ascending:false}).limit(3);
      cycles=(cR&&cR.data)||[];
    }catch(e){}

    const DL=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const rows=[];
    for(let d=1;d<=31;d++){
      const dt=new Date(y,m,d);
      if(dt.getMonth()!==m)break;
      const fecha=dt.toISOString().split('T')[0];
      rows.push({d,fecha,diaSem:DL[dt.getDay()],sched:schedule[fecha]||null,motor:calcMotorPhase(perfil,fecha)});
    }
    set({loading:false,motorClient:{perfil,rows,scheduleSessions:sessions},clientCycle:cycles,genRows:[],genState:'idle'});
  }catch(err){
    set({loading:false});
    alert('Error cargando la clienta: '+(err&&err.message?err.message:'desconocido'));
  }
}

function adminMapearFaseLunar(dia,dur){
  if(dur<22||dur>40)return{fase:'menguante_b',orden:1};
  const r={luna_nueva:[1,5],creciente:[6,dur-15],llena:[dur-14,dur-12],menguante_a:[dur-11,dur-5],menguante_b:[dur-4,dur]};
  const mx={luna_nueva:5,creciente:8,llena:3,menguante_a:7,menguante_b:5};
  const fases=Object.keys(r);
  for(let i=0;i<fases.length;i++){
    const f=fases[i],ini=r[f][0],fin=r[f][1];
    if(dia>=ini&&dia<=fin)return{fase:f,orden:((dia-ini)%mx[f])+1};
  }
  return{fase:'menguante_b',orden:1};
}

function calcMotorPhase(perfil,fecha){
  if(!perfil||!perfil.ancla)return null;
  const ancla=new Date(perfil.ancla+'T00:00:00');
  const hoy=new Date(fecha+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  if(perfil.ruta==='energia'){
    const db=(dias%28)+1;
    return{fase:'semana_'+Math.ceil(db/7),dia:db,orden:((db-1)%7)+1};
  }
  const dur=perfil.duracion_ciclo||28;
  // Proyecta ciclos de 'dur' días, igual que generar_motor() en Supabase
  const dc=(dias%dur)+1;
  const r=adminMapearFaseLunar(dc,dur);
  return{fase:r.fase,dia:dc,orden:r.orden};
}

function buildStrip(perfil){
  const s=[];
  for(let d=1;d<=30;d++){
    const f='2026-09-'+String(d).padStart(2,'0');
    s.push({d,fecha:f,motor:calcMotorPhase(perfil,f)});
  }
  return s;
}

async function doAddClient(){
  const g=function(id){const e=document.getElementById(id);return e?e.value:'';};
  const name=g('ac-name').trim(),email=g('ac-email').trim(),pass=g('ac-pass').trim();
  const plan=g('ac-plan')||'presencial',ruta=g('ac-ruta'),sub=g('ac-sub')||null;
  const ancla=g('ac-ancla')||null,dias=g('ac-dias').trim();
  // Acepta "Lunes Miércoles Viernes", "lun, mie, vie", "lunes y viernes"… y guarda lun/mar/mie/jue/vie/sab/dom
  const DIA_ABR={lu:'lun',ma:'mar',mi:'mie',ju:'jue',vi:'vie',sa:'sab',do:'dom'};
  const diasArr=dias?Array.from(new Set(dias.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .split(/[^a-z]+/).filter(function(w){return w.length>=2&&w!=='y';}).map(function(w){return DIA_ABR[w.slice(0,2)];}).filter(Boolean))):null;
  if(!name||!email||!pass){set({pForm:Object.assign({},S.pForm||{},{error:'Nombre, correo y contraseña son obligatorios.'})});return;}
  if(!ruta){set({pForm:Object.assign({},S.pForm||{},{error:'Selecciona la ruta.'})});return;}
  set({loading:true,pForm:Object.assign({},S.pForm||{},{error:'',ok:''})});
  try{
    // Registro con un cliente aparte que no guarda sesión: así el admin NO queda logueado como la clienta nueva
    const sbAlta=createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'alta-clienta'}});
    const r=await sbAlta.auth.signUp({email:email,password:pass});
    if(r.error)throw new Error(r.error.message);
    const uid=r.data&&r.data.user&&r.data.user.id;
    if(!uid)throw new Error('No se obtuvo el ID del usuario');
    const up=await sb.from('profiles').upsert({id:uid,name:name,plan:plan,ruta:ruta,sub_perfil:sub,nivel:1,duracion_ciclo:28,ancla:ancla,escenario_default:'C',dias_presenciales:diasArr});
    if(up.error)throw new Error('La cuenta se creó, pero no se pudo guardar el perfil: '+up.error.message);
    await loadData();
    set({loading:false,pForm:{name:'',email:'',pass:'',ruta:'',plan:'presencial',error:'',ok:'✅ Clienta creada: '+name+'. Ya puede entrar con su correo y contraseña.'}});
  }catch(e){
    set({loading:false,pForm:Object.assign({},S.pForm||{},{error:'Error: '+e.message})});
  }
}
