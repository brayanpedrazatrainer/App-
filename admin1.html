// ── GENERADOR DE MES ──────────────────────────────────────────────

const DIAS_ABR=['dom','lun','mar','mie','jue','vie','sab'];
const FASE_SESION_MAP={
  luna_nueva:'suave',creciente:'principal',llena:'integradora',
  menguante_a:'integradora',menguante_b:'suave',
  semana_1:'principal',semana_2:'principal',semana_3:'integradora',semana_4:'suave'
};

function esDiaPresencial(fecha, diasPres){
  if(!diasPres||!diasPres.length)return false;
  const d=new Date(fecha+'T12:00:00');
  const abr=DIAS_ABR[d.getDay()];
  return diasPres.some(function(x){return x.toLowerCase().replace('é','e').replace('á','a')===abr;});
}

async function generarMes(){
  const mc=S.motorClient;
  if(!mc||!mc.perfil){alert('Selecciona una clienta primero.');return;}
  const perfil=mc.perfil;
  if(!perfil.ancla){alert('Esta clienta no tiene ancla configurada.');return;}
  set({loading:true});
  try{
    const DL=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const year=S.scheduleYear, month=S.scheduleMonth;
    const days=getDaysInMonth(year,month);

    let tarjetas=[];
    try{
      const ptR=await sb.from('plantilla_tarjetas').select('fase,orden,tipo,session_id,sessions(id,session_type),plantillas!inner(ruta,activa)').eq('plantillas.ruta',perfil.ruta||'lunar').eq('plantillas.activa',true);
      tarjetas=(ptR&&ptR.data)||[];
    }catch(err){tarjetas=[];}

    let progSessions=[];
    try{
      const cpR=await sb.from('client_programs').select('program_id').eq('client_id',perfil.id).maybeSingle();
      if(cpR&&cpR.data&&cpR.data.program_id){
        const sR=await sb.from('sessions').select('id,session_type').eq('program_id',cpR.data.program_id).order('week_number').order('day_number');
        progSessions=(sR&&sR.data)||[];
      }
    }catch(err){progSessions=[];}

    const rows=[];
    days.forEach(function(day){
      const fecha=day.toISOString().split('T')[0];
      const motor=calcMotorPhase(perfil,fecha);
      const presencial=esDiaPresencial(fecha,perfil.dias_presenciales);
      const modo=presencial?'Con Brayan':'Sesión Reina';
      let sesId='',sesNombre='';
      if(motor){
        const t=tarjetas.find(function(x){return x.fase===motor.fase&&Number(x.orden)===Number(motor.orden);});
        if(t&&t.session_id){
          sesId=t.session_id;
          sesNombre=t.sessions?t.sessions.session_type:('Tarjeta '+motor.fase);
        } else if(progSessions.length){
          const kw=FASE_SESION_MAP[motor.fase]||'suave';
          const cands=progSessions.filter(function(s){return new RegExp(kw,'i').test(s.session_type||'')&&!/abdomen/i.test(s.session_type||'');});
          if(cands.length){const pick=cands[(motor.orden-1)%cands.length];sesId=pick.id;sesNombre=pick.session_type;}
        }
      }
      rows.push({fecha,d:day.getDate(),diaSem:DL[day.getDay()],motor,modo,sesId,sesNombre,editedSesId:sesId});
    });
    set({loading:false,genRows:rows,genState:'idle'});
  }catch(err){
    set({loading:false});
    alert('Error al generar: '+(err&&err.message?err.message:'desconocido'));
  }
}

async function saveGeneratedRows(){
  const mc=S.motorClient;if(!mc)return;
  const clientId=mc.perfil.id;
  const year=S.scheduleYear,month=S.scheduleMonth;
  const firstDay=new Date(year,month,1).toISOString().split('T')[0];
  const lastDay=new Date(year,month+1,0).toISOString().split('T')[0];
  // Check existing
  const exR=await sb.from('scheduled_sessions').select('id,scheduled_date').eq('client_id',clientId).gte('scheduled_date',firstDay).lte('scheduled_date',lastDay);
  const existing=exR.data||[];
  if(existing.length>0&&S.genState==='idle'){
    set({genState:'conflict',genConflictCount:existing.length});return;
  }
  set({loading:true});
  const rows=S.genRows.filter(function(r){return r.editedSesId;});
  if(S.genState==='overwrite'||S.genState==='conflict'&&existing.length>0){
    await sb.from('scheduled_sessions').delete().eq('client_id',clientId).gte('scheduled_date',firstDay).lte('scheduled_date',lastDay);
  }
  const toInsert=rows.map(function(r){
    if(S.genState==='skip'){
      const exists=existing.find(function(e){return e.scheduled_date===r.fecha;});
      if(exists)return null;
    }
    return{client_id:clientId,scheduled_date:r.fecha,session_id:r.editedSesId,status:'pending',session_mode:r.modo};
  }).filter(Boolean);
  if(toInsert.length>0)await sb.from('scheduled_sessions').insert(toInsert);
  set({loading:false,genState:'saved',genConflictCount:0});
  alert('✅ '+toInsert.length+' sesiones guardadas para '+(MONTHS_ES[month])+' '+year);
}

async function borrarMes(){
  const mc=S.motorClient;if(!mc)return;
  if(!confirm('¿Borrar TODAS las sesiones programadas de este mes para '+mc.perfil.name+'? No se puede deshacer.'))return;
  const year=S.scheduleYear,month=S.scheduleMonth;
  const firstDay=new Date(year,month,1).toISOString().split('T')[0];
  const lastDay=new Date(year,month+1,0).toISOString().split('T')[0];
  set({loading:true});
  await sb.from('scheduled_sessions').delete().eq('client_id',mc.perfil.id).gte('scheduled_date',firstDay).lte('scheduled_date',lastDay);
  set({loading:false,genRows:[],genState:'idle'});
  alert('🗑 Mes borrado.');
}

async function loadMotorClient(clientId){
  set({loading:true});
  try{
    const c=(S.clients||[]).find(function(x){return x.id===clientId;})||{};
    const y=S.scheduleYear, m=S.scheduleMonth;
    const firstD=new Date(y,m,1).toISOString().split('T')[0];
    const lastD=new Date(y,m+1,0).toISOString().split('T')[0];

    const profR=await sb.from('profiles').select('*').eq('id',clientId).maybeSingle();
    const perfil=Object.assign({},c,(profR&&profR.data)||{});

    let schedRows=[];
    try{
      const sR=await sb.from('scheduled_sessions').select('*,sessions(id,session_type)').eq('client_id',clientId).gte('scheduled_date',firstD).lte('scheduled_date',lastD);
      schedRows=(sR&&sR.data)||[];
    }catch(e){schedRows=[];}
    const schedule={};
    schedRows.forEach(function(r){schedule[r.scheduled_date]=r;});

    let sessions=[];
    try{
      const cpR=await sb.from('client_programs').select('program_id').eq('client_id',clientId).maybeSingle();
      if(cpR&&cpR.data&&cpR.data.program_id){
        const sessR=await sb.from('sessions').select('id,session_type').eq('program_id',cpR.data.program_id).order('week_number').order('day_number');
        sessions=Array.from(new Map(((sessR&&sessR.data)||[]).map(function(s){return [s.session_type,s];})).values());
      }
    }catch(e){}
    if(!sessions.length){
      try{
        const ptR=await sb.from('plantilla_tarjetas').select('sessions(id,session_type),plantillas!inner(ruta,activa)').eq('plantillas.ruta',perfil.ruta||'lunar').eq('plantillas.activa',true);
        const uniq=new Map();
        ((ptR&&ptR.data)||[]).forEach(function(t){if(t.sessions)uniq.set(t.sessions.session_type,t.sessions);});
        sessions=Array.from(uniq.values());
      }catch(e){}
    }
    if(!sessions.length){
      try{
        const allS=await sb.from('sessions').select('id,session_type').limit(200);
        sessions=Array.from(new Map(((allS&&allS.data)||[]).map(function(s){return [s.session_type,s];})).values());
      }catch(e){}
    }

    let cycles=[];
    try{
      const cR=await sb.from('cycle_logs').select('*').eq('client_id',clientId).order('created_at',{ascending:false}).limit(3);
      cycles=(cR&&cR.data)||[];
    }catch(e){}

    const DL=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const rows=[];
    for(let d=1;d<=31;d++){
      const dt=new Date(y,m,d);
      if(dt.getMonth()!==m)break;
      const fecha=dt.toISOString().split('T')[0];
      rows.push({d,fecha,diaSem:DL[dt.getDay()],sched:schedule[fecha]||null,motor:calcMotorPhase(perfil,fecha)});
    }
    set({loading:false,motorClient:{perfil,rows,scheduleSessions:sessions},clientCycle:cycles,genRows:[],genState:'idle'});
  }catch(err){
    set({loading:false});
    alert('Error cargando la clienta: '+(err&&err.message?err.message:'desconocido'));
  }
}

function getDaysInMonth(y,m){
  const days=[];
  const d=new Date(y,m,1);
  while(d.getMonth()===m){days.push(new Date(d));d.setDate(d.getDate()+1);}
  return days;
}

function adminMapearFaseLunar(dia,dur){
  if(dur<22||dur>40)return{fase:'menguante_b',orden:1};
  const r={luna_nueva:[1,5],creciente:[6,dur-15],llena:[dur-14,dur-12],menguante_a:[dur-11,dur-5],menguante_b:[dur-4,dur]};
  const mx={luna_nueva:5,creciente:8,llena:3,menguante_a:7,menguante_b:5};
  const fases=Object.keys(r);
  for(let i=0;i<fases.length;i++){
    const f=fases[i],ini=r[f][0],fin=r[f][1];
    if(dia>=ini&&dia<=fin)return{fase:f,orden:((dia-ini)%mx[f])+1};
  }
  return{fase:'menguante_b',orden:1};
}

function calcMotorPhase(perfil,fecha){
  if(!perfil||!perfil.ancla)return null;
  const ancla=new Date(perfil.ancla+'T00:00:00');
  const hoy=new Date(fecha+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  if(perfil.ruta==='energia'){
    const db=(dias%28)+1;
    return{fase:'semana_'+Math.ceil(db/7),dia:db,orden:((db-1)%7)+1};
  }
  const dur=perfil.duracion_ciclo||28;
  const dc=dias+1;
  if(dc>dur)return{fase:'menguante_b',dia:dur,orden:(((dc-dur)-1)%5)+1};
  const r=adminMapearFaseLunar(dc,dur);
  return{fase:r.fase,dia:dc,orden:r.orden};
}

function buildStrip(perfil){
  const s=[];
  for(let d=1;d<=30;d++){
    const f='2026-09-'+String(d).padStart(2,'0');
    s.push({d,fecha:f,motor:calcMotorPhase(perfil,f)});
  }
  return s;
}

async function doAddClient(){
  const g=function(id){const e=document.getElementById(id);return e?e.value:'';};
  const name=g('ac-name').trim(),email=g('ac-email').trim(),pass=g('ac-pass').trim();
  const plan=g('ac-plan')||'presencial',ruta=g('ac-ruta'),sub=g('ac-sub')||null;
  const ancla=g('ac-ancla')||null,dias=g('ac-dias').trim();
  const diasArr=dias?dias.split(',').map(function(d){return d.trim();}).filter(Boolean):null;
  if(!name||!email||!pass){set({pForm:Object.assign({},S.pForm||{},{error:'Nombre, correo y contraseña son obligatorios.'})});return;}
  if(!ruta){set({pForm:Object.assign({},S.pForm||{},{error:'Selecciona la ruta.'})});return;}
  set({loading:true,pForm:Object.assign({},S.pForm||{},{error:'',ok:''})});
  try{
    const r=await sb.auth.signUp({email:email,password:pass});
    if(r.error)throw new Error(r.error.message);
    const uid=r.data&&r.data.user&&r.data.user.id;
    if(!uid)throw new Error('No se obtuvo el ID del usuario');
    await sb.from('profiles').upsert({id:uid,name:name,plan:plan,ruta:ruta,sub_perfil:sub,nivel:2,duracion_ciclo:28,ancla:ancla,escenario_default:'C',dias_presenciales:diasArr});
    await loadData();
    set({loading:false,pForm:{name:'',email:'',pass:'',ruta:'',plan:'presencial',error:'',ok:'✅ Clienta creada. Confirma el correo en Supabase → Authentication → Users si no puede entrar.'}});
  }catch(e){
    set({loading:false,pForm:Object.assign({},S.pForm||{},{error:'Error: '+e.message})});
  }
}

    if(ex.bloque)h+='<span style="background:#eef2ff;color:#3730a3;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700">B'+ex.bloque+'</span>';
    if(ex.cue)h+='<span style="background:#f0fdf4;color:#16a34a;border-radius:4px;padding:1px 7px;font-size:10px">"'+esc(ex.cue)+'"</span>';
    h+='</div><div style="display:flex;gap:6px;align-items:center">';
    h+='<input type="url" value="'+esc(ex.video_url||'')+'" placeholder="URL video YouTube..." onchange="updateVideo(\''+ex.id+'\',\''+s.id+'\',this.value)" style="flex:1;padding:7px 10px;border:1.5px solid '+C.g3+';border-radius:8px;font-size:12px;outline:none;color:#191211">';
    if(ex.video_url)h+='<a href="'+esc(ex.video_url)+'" target="_blank" style="color:'+C.pr+';font-size:12px;text-decoration:none;font-weight:700;background:#fde8e8;padding:6px 10px;border-radius:7px">▶</a>';
    h+='</div></div><div style="display:flex;flex-direction:column;gap:4px;align-self:flex-start">';
    h+='<button onclick="editExById(\''+ex.id+'\')" style="background:#f3f4f6;border:none;color:#374151;border-radius:8px;padding:6px 8px;font-size:11px">✏️</button>';
    h+='<button onclick="delEx(\''+ex.id+'\',\''+s.id+'\')" style="background:#fde8e8;border:none;color:'+C.pr+';border-radius:8px;padding:6px 8px;font-size:11px">🗑</button>';
    h+='</div></div></div>';
  });
  return h;
}

function rMotor(){
  const mc=S.motorClient;
  let h='<p style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:'+C.g2+';margin-bottom:10px">Seleccionar clienta</p>';
  h+='<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">';
  (S.clients||[]).forEach(function(c){
    const sel=mc&&mc.perfil&&mc.perfil.id===c.id;
    h+='<button data-cid="'+c.id+'" onclick="loadMotorClient(this.dataset.cid)" style="text-align:left;padding:10px 14px;border-radius:10px;border:2px solid '+(sel?C.pr:C.g3)+';background:'+(sel?'#fde8e8':C.wh)+';color:'+(sel?C.pr:C.td)+';font-weight:'+(sel?700:400)+';font-size:13px">'+esc(c.name)+'</button>';
  });
  h+='</div>';
  if(!mc)return h;
  const p=mc.perfil;
  h+='<div style="background:'+C.bk+';border-radius:13px;padding:14px;margin-bottom:14px;color:#fff"><p style="font-weight:900;font-size:17px;margin-bottom:4px">'+esc(p.name)+'</p>';
  if(p.ancla)h+='<p style="font-size:12px;color:'+C.g2+'">Ruta: <b style="color:#fff">'+(p.ruta||'—')+'</b> · Ancla: <b style="color:#fff">'+p.ancla+'</b> · Ciclo: <b style="color:#fff">'+(p.duracion_ciclo||28)+' días</b></p>';
  else h+='<p style="font-size:12px;color:#ef4444">⚠ Sin ancla configurada</p>';
  h+='</div>';
  if(!p.ancla)return h;
  h+=rSchedule();
  return h;
}

window.saveProgram=saveProgram;window.delProg=delProg;window.saveSession=saveSession;window.delSess=delSess;
window.saveExercise=saveExercise;window.updateVideo=updateVideo;window.delEx=delEx;

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){S.user=session.user;await loadData();}
  else render();
}
init();
