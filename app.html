// ── HOY ──────────────────────────────────────────────────────

const WEEK_ES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTH_ES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function currentProgWeek(lastBleeding, cycleLen){
  if(!lastBleeding) return 0;
  const cd=getCycleDay(lastBleeding);
  if(!cd) return 0;
  if(cd<=7) return 0;
  else if(cd<=14) return 1;
  else if(cd<=21) return 2;
  else return 3;
}

function sPct(sess){

function rSess(){
  const weeks=S.PROG;
  if(!weeks||weeks.length===0)return '';
  const sess=weeks[S.sessW]&&weeks[S.sessW][S.sessI];
  if(!sess)return '';
  const sem=(S.checkin&&S.checkin.semaforo)||'verde';
  const BLOQUES_ROJO=[1,2,5];
  function sH(ex){
    if(sem==='amarillo')return Math.max(1,(ex.sets||1)-1);
    return ex.sets||1;
  }
  let exList=sess.ex||[];
  if(sem==='rojo')exList=exList.filter(function(ex){return !ex.bloque||BLOQUES_ROJO.indexOf(ex.bloque)>=0;});

  const todSessId=S.todaySchedule?S.todaySchedule.session_id:null;
  const isToday=todSessId&&sess.id&&todSessId===sess.id;
  const isCompleted=S.todaySchedule&&S.todaySchedule.status==='completed';
  const dc=exList.filter(function(ex){
    const n=sH(ex);
    return Array.from({length:n},function(_,k){return S.completions[ex.eid+'_'+k];}).every(Boolean);
  }).length;

  let h='<div style="background:'+C.bk+';border-radius:14px;padding:15px;margin-bottom:13px;color:#fff;border:1px solid #2a2523">';

      h+='<div style="background:#f8f8f8;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(25,18,17,.08)">';

      h+='<span style="font-size:18px;color:'+C.g2+'">▸</span>';
      h+='</div>';
      if(subs.length>0){
        h+='<div id="blin'+i+'" style="display:none;flex-direction:column;gap:8px;padding:0 13px 13px">';
        subs.forEach(function(item){
          const se=item.ex;const si=item.oi;
          const n=sH(se);
          const aD=Array.from({length:n},function(_,k){return S.completions[se.eid+'_'+k];}).every(Boolean);

          h+='</div><div style="display:flex;gap:5px">';
          for(let k=0;k<n;k++){
            const d=S.completions[se.eid+'_'+k];
            h+='<button id="sb-'+se.eid+'-'+k+'" onclick="tSet(\''+se.eid+'\','+k+','+n+')" style="width:34px;height:34px;border-radius:7px;font-weight:700;font-size:11px;border:2px solid '+(d?C.pr:C.g3)+';background:'+(d?C.pr:C.wh)+';color:'+(d?C.wh:C.tl)+'">'+(d?'✓':'S'+(k+1))+'</button>';

function limpiarNombre(s){
  // Solo quita emojis y símbolos especiales, mantiene tildes y ñ
  return (s||'').replace(/[\u{1F300}-\u{1FFFF}\u{2600}-\u{27BF}\u{2E00}-\u{2EFF}]/gu,'')
    .replace(/[⚡⚠📅🌑🌓🌕🌗🌘💪🔥🛡]/g,'')
    .replace(/[12345]️⃣/g,'')
    .trim();
}

function getCurrentFase(){
  if(S.motorTarjeta&&S.motorTarjeta.fase)return S.motorTarjeta.fase;
  const p=S.perfilExt;
  if(!p||!p.ancla)return null;
  const ancla=new Date(p.ancla+'T00:00:00');
  const hoy=new Date(today()+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  if(p.ruta==='energia')return 'semana_'+Math.ceil(((dias%28)+1)/7);
  const dur=p.duracion_ciclo||28;
  const dc=dias+1;
  if(dc>dur)return 'menguante_b';
  return mapearFaseLunar(dc,dur).fase;
}

function sugerirKg(lastLog, baseKg){
  if(!lastLog||!lastLog.kg)return baseKg||null;
  if(lastLog.esfuerzo===1){
    const step=lastLog.kg<10?1.25:lastLog.kg<20?2.5:5;
    return Math.round((lastLog.kg+step)*2)/2;
  }
  return lastLog.kg;
}

function mapearFaseLunar(dia,dur){
  if(dur<22||dur>40)return{fase:'menguante_b',orden:1};
  const r={
    luna_nueva:[1,5],
    creciente:[6,dur-15],
    llena:[dur-14,dur-12],
    menguante_a:[dur-11,dur-5],
    menguante_b:[dur-4,dur]
  };
  const mx={luna_nueva:5,creciente:8,llena:3,menguante_a:7,menguante_b:5};
  for(const[f,[ini,fin]]of Object.entries(r)){
    if(dia>=ini&&dia<=fin){
      const orden=((dia-ini)%mx[f])+1;
      return{fase:f,orden};
    }
  }
  return{fase:'menguante_b',orden:1};
}

async function calcularTarjetaMotor(perfil,userId,fecha){
  if(!perfil.ancla)return null;
  const ancla=new Date(perfil.ancla+'T00:00:00');
  const hoy=new Date(fecha+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  let fase,orden;
  if(perfil.ruta==='energia'){
    const db=(dias%28)+1;
    fase='semana_'+Math.ceil(db/7);
    orden=((db-1)%7)+1;
  } else {
    const dur=perfil.duracion_ciclo||28;
    const diaCiclo=dias+1;
    if(diaCiclo>dur){
      fase='menguante_b';
      orden=(((diaCiclo-dur)-1)%5)+1;
    } else {
      const r=mapearFaseLunar(diaCiclo,dur);
      fase=r.fase;orden=r.orden;
    }
  }
  const ruta=perfil.ruta||'lunar';
  const{data}=await sb.from('plantilla_tarjetas')
    .select('*,plantillas!inner(nombre,ruta,activa)')
    .eq('fase',fase).eq('orden',orden)
    .eq('plantillas.ruta',ruta).eq('plantillas.activa',true)
    .maybeSingle();
  return{fase,orden,ruta,tarjeta:data||null};
}

function calcularSemaforo(energia,animo,molestias,sueno){
  const puntos=energia+animo+sueno+(4-molestias); // rango 4..12
  if(puntos<=6)return 'rojo';
  if(puntos<=9)return 'amarillo';
  return 'verde';
}

async function ajustarSemaforo(dir){
  const orden=['rojo','amarillo','verde'];
  const actual=(S.checkin&&S.checkin.semaforo)||'amarillo';
  const idx=orden.indexOf(actual);
  const nuevo=orden[Math.max(0,Math.min(2,idx+dir))];
  const c=S.checkin||{};
  await guardarCheckin(c.energia,c.animo,c.molestias,c.sueno,nuevo);
}

    prog=pResults[0].data;

    if(sessions.length>0){
      const sessIds=sessions.map(function(s){return s.id});

      const sessionsWithEx=sessions.map(function(s){return Object.assign({},s,{exercises:exercises.filter(function(e){return e.session_id===s.id})})});
      prog=Object.assign({},prog,{sessions:sessionsWithEx});
      PROG=buildProg(prog);
    }
  }
  const cycleHistory=results[2].data||[];
  const lastBleeding=cycleHistory.length>0?cycleHistory[0].last_bleeding_date:null;
  const cycleLen=cycleHistory.length>0?cycleHistory[0].cycle_length:28;
  const symLog={};(results[3].data||[]).forEach(function(r){symLog[r.log_date]=r});
  const menoLog={};(results[4].data||[]).forEach(function(r){menoLog[r.log_date]=r});
  const completions={};(results[6].data||[]).forEach(function(r){completions[r.exercise_id+'_'+r.set_number]=true});
  const[todR,profExtR,checkinR]=await Promise.all([
    sb.from('scheduled_sessions').select('*').eq('client_id',userId).eq('scheduled_date',today()).maybeSingle(),
    sb.from('profiles').select('plan,ruta,sub_perfil,nivel,duracion_ciclo,ancla,escenario_default,dias_presenciales').eq('id',userId).single(),

  const nextWeek=new Date();nextWeek.setDate(nextWeek.getDate()+7);
  function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  const upcomingR=await sb.from('scheduled_sessions').select('*').eq('client_id',userId).gte('scheduled_date',localDate(tomorrow)).lte('scheduled_date',localDate(nextWeek)).order('scheduled_date').limit(6);

function buildProg(prog){
  if(!prog||!prog.sessions)return [];
  const weeks=[];
  prog.sessions.forEach(function(s){if(weeks.indexOf(s.week_number)<0)weeks.push(s.week_number)});
  weeks.sort(function(a,b){return a-b});
  return weeks.map(function(wn){
    return prog.sessions.filter(function(s){return s.week_number===wn}).sort(function(a,b){return a.day_number-b.day_number}).map(function(sess){
      return {
        id:sess.id,week:wn,day:'Día '+sess.day_number,type:sess.session_type,
        ex:(sess.exercises||[]).sort(function(a,b){return a.order_index-b.order_index}).map(function(ex){
          return {eid:ex.id,n:ex.name,m:ex.muscle_group,sets:ex.sets_count,reps:ex.reps_range,v:ex.video_url||'',bloque:ex.bloque||null,patron:ex.patron||null,carga_pct:ex.carga_pct||null,carga_kg:ex.carga_kg||null,tempo:ex.tempo||null,cue:ex.cue||null}
        })
      }
    });
  });
}

async function initBatchEsfuerzo(){
  const sess=S.PROG&&S.PROG[S.sessW]&&S.PROG[S.sessW][S.sessI];
  if(!sess){markSessionDone();return;}
  // Find exercises with carga_kg not yet marked today
  const withCarga=(sess.ex||[]).filter(function(ex){return ex.carga_kg;});
  const faseHoy=getCurrentFase();
  let markedToday=new Set();
  if(faseHoy){
    const r=await sb.from('carga_log').select('exercise_id').eq('client_id',S.user.id).eq('fecha',today()).eq('fase',faseHoy);
    (r.data||[]).forEach(function(row){markedToday.add(row.exercise_id);});
  }
  const needsBatch=withCarga.filter(function(ex){return !markedToday.has(ex.eid);});
  if(needsBatch.length===0){markSessionDone();return;}
  set({showBatchEsfuerzo:true,batchEsfuerzoExs:needsBatch});
}

}

const WEEK_ES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTH_ES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function currentProgWeek(lastBleeding, cycleLen){
  if(!lastBleeding) return 0;
  const cd=getCycleDay(lastBleeding);
  if(!cd) return 0;
  if(cd<=7) return 0;
  else if(cd<=14) return 1;
  else if(cd<=21) return 2;
  else return 3;
}

function sPct(sess){
  let t=0,d=0;
  (sess.ex||[]).forEach(function(ex){for(let i=0;i<ex.sets;i++){t++;if(S.completions[ex.eid+'_'+i])d++;}});
  return t===0?0:Math.round((d/t)*100);
}

function limpiarNombre(s){
  // Solo quita emojis y símbolos especiales, mantiene tildes y ñ
  return (s||'').replace(/[\u{1F300}-\u{1FFFF}\u{2600}-\u{27BF}\u{2E00}-\u{2EFF}]/gu,'')
    .replace(/[⚡⚠📅🌑🌓🌕🌗🌘💪🔥🛡]/g,'')

}

function getCurrentFase(){
  if(S.motorTarjeta&&S.motorTarjeta.fase)return S.motorTarjeta.fase;
  const p=S.perfilExt;
  if(!p||!p.ancla)return null;
  const ancla=new Date(p.ancla+'T00:00:00');
  const hoy=new Date(today()+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  if(p.ruta==='energia')return 'semana_'+Math.ceil(((dias%28)+1)/7);
  const dur=p.duracion_ciclo||28;
  const dc=dias+1;
  if(dc>dur)return 'menguante_b';
  return mapearFaseLunar(dc,dur).fase;
}

function sugerirKg(lastLog, baseKg){
  if(!lastLog||!lastLog.kg)return baseKg||null;
  if(lastLog.esfuerzo===1){
    const step=lastLog.kg<10?1.25:lastLog.kg<20?2.5:5;
    return Math.round((lastLog.kg+step)*2)/2;
  }
  return lastLog.kg;
}

function mapearFaseLunar(dia,dur){
  if(dur<22||dur>40)return{fase:'menguante_b',orden:1};
  const r={
    luna_nueva:[1,5],
    creciente:[6,dur-15],
    llena:[dur-14,dur-12],
    menguante_a:[dur-11,dur-5],
    menguante_b:[dur-4,dur]
  };
  const mx={luna_nueva:5,creciente:8,llena:3,menguante_a:7,menguante_b:5};
  for(const[f,[ini,fin]]of Object.entries(r)){
    if(dia>=ini&&dia<=fin){
      const orden=((dia-ini)%mx[f])+1;
      return{fase:f,orden};
    }
  }
  return{fase:'menguante_b',orden:1};
}

async function calcularTarjetaMotor(perfil,userId,fecha){
  if(!perfil.ancla)return null;
  const ancla=new Date(perfil.ancla+'T00:00:00');
  const hoy=new Date(fecha+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  let fase,orden;
  if(perfil.ruta==='energia'){
    const db=(dias%28)+1;
    fase='semana_'+Math.ceil(db/7);
    orden=((db-1)%7)+1;
  } else {
    const dur=perfil.duracion_ciclo||28;
    const diaCiclo=dias+1;
    if(diaCiclo>dur){
      fase='menguante_b';
      orden=(((diaCiclo-dur)-1)%5)+1;
    } else {
      const r=mapearFaseLunar(diaCiclo,dur);
      fase=r.fase;orden=r.orden;
    }
  }
  const ruta=perfil.ruta||'lunar';
  const{data}=await sb.from('plantilla_tarjetas')
    .select('*,plantillas!inner(nombre,ruta,activa)')
    .eq('fase',fase).eq('orden',orden)
    .eq('plantillas.ruta',ruta).eq('plantillas.activa',true)
    .maybeSingle();
  return{fase,orden,ruta,tarjeta:data||null};
}

function buildProg(prog){
  if(!prog||!prog.sessions)return [];
  const weeks=[];
  prog.sessions.forEach(function(s){if(weeks.indexOf(s.week_number)<0)weeks.push(s.week_number)});
  weeks.sort(function(a,b){return a-b});
  return weeks.map(function(wn){
    return prog.sessions.filter(function(s){return s.week_number===wn}).sort(function(a,b){return a.day_number-b.day_number}).map(function(sess){
      return {
        id:sess.id,week:wn,day:'Día '+sess.day_number,type:sess.session_type,
        ex:(sess.exercises||[]).sort(function(a,b){return a.order_index-b.order_index}).map(function(ex){
          return {eid:ex.id,n:ex.name,m:ex.muscle_group,sets:ex.sets_count,reps:ex.reps_range,v:ex.video_url||'',bloque:ex.bloque||null,patron:ex.patron||null,carga_pct:ex.carga_pct||null,carga_kg:ex.carga_kg||null,tempo:ex.tempo||null,cue:ex.cue||null}
        })
      }
    });
  });
}

async function markSessionDone(){
  if(!S.todaySchedule||!S.user)return;
  const {data}=await sb.from('scheduled_sessions')
    .update({status:'completed'})
    .eq('id',S.todaySchedule.id)
    .select().single();
  if(data){
    S.todaySchedule={...S.todaySchedule,status:'completed'};
    render();
  }
}

window.saveMeno=saveMeno;window.tSet=tSet;window.tM=tM;window.saveMed=saveMed;window.today=today;window.markSessionDone=markSessionDone;

async function init(){
  try{
    const res=await sb.auth.getSession();
    if(res.data&&res.data.session){S.user=res.data.session.user;await loadClientData();}
    else render();
  }catch(e){render();}
}
init();
