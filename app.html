<style>
/* Estética de El Reino (mismas fuentes, colores y paneles que la app del Club) */
:root{--ink:#0E0B0A;--surface:#191211;--surface-2:#221818;--red:#C7372C;--burgundy:#710D0B;--gold:#B8963E;--gold-soft:#E0C97F;
  --cream:#F2E9DC;--muted:#A08D82;--line:rgba(184,150,62,.22);
  --heroic:'Cinzel',Georgia,serif;--brandface:'Bebas Neue',Impact,sans-serif;--voice:'Fraunces',Georgia,serif;--ui:'Karla',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);min-height:100vh;color:var(--cream)}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 40% at 50% -6%,rgba(113,13,11,.45) 0%,rgba(14,11,10,0) 62%),var(--ink)}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit;background-color:rgba(0,0,0,.28);color:var(--cream)}
input::placeholder,textarea::placeholder{color:rgba(242,233,220,.4)}
input[type=date]{color-scheme:dark}
input[type=range]{accent-color:var(--gold);width:100%;display:block;background:none}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.panel-reino{position:relative}
.panel-reino>.esq{position:absolute;width:10px;height:10px;border:1px solid var(--gold);opacity:.5;pointer-events:none}
.panel-reino>.e1{top:5px;left:5px;border-right:none;border-bottom:none}
.panel-reino>.e2{top:5px;right:5px;border-left:none;border-bottom:none}
.panel-reino>.e3{bottom:5px;left:5px;border-right:none;border-top:none}
.panel-reino>.e4{bottom:5px;right:5px;border-left:none;border-top:none}
.btn-reino{transition:transform .12s ease,box-shadow .12s ease,filter .18s ease}
.btn-reino:active{transform:translateY(3px)}
.tit-reino{font-family:var(--heroic);letter-spacing:.08em}
/* Modo entreno guiado (paso a paso), mismo diseño que El Reino */
.g-barra{height:4px;border-radius:3px;background:rgba(242,233,220,.10);overflow:hidden;margin-top:6px}
.g-relleno{height:100%;background:linear-gradient(90deg,var(--burgundy),var(--red),var(--gold));transition:width .35s ease}
.g-paso{font-family:var(--heroic);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:10px;text-align:center}
.g-bloque{font-family:var(--heroic);font-weight:700;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.g-titulo{font-family:var(--heroic);font-weight:900;font-size:23px;letter-spacing:.04em;color:var(--cream);line-height:1.2;text-shadow:0 2px 0 rgba(0,0,0,.8)}
.g-que{font-size:13.5px;color:var(--muted);line-height:1.55;margin-top:9px}
.g-series{font-size:16px;color:var(--cream);line-height:1.4;margin-top:12px}
.g-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.g-chip{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(242,233,220,.06);color:var(--cream)}
.g-cue{font-family:var(--voice);font-style:italic;font-size:14.5px;color:#E8A598;line-height:1.5;margin-top:10px}
.g-aviso{font-size:12px;font-weight:700;color:#E0A458;margin-top:8px}
.g-video{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.g-vbtn{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(184,150,62,.08);color:var(--gold-soft);font-family:var(--heroic);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.g-vbtn[aria-pressed="true"]{border-color:var(--gold);background:rgba(184,150,62,.18)}
.g-lista .g-vbtn{text-align:left;text-transform:none;letter-spacing:.01em;font-family:var(--ui);font-weight:600;font-size:13.5px;color:var(--cream);padding:12px 14px}
.g-vsin{padding:12px 14px;border:1px dashed var(--line);border-radius:8px;font-size:13.5px;color:var(--cream)}
.g-dosis{display:block;margin-top:3px;font-family:var(--ui);font-weight:400;font-size:12px;color:var(--muted)}
.g-dosis b{font-weight:600;color:var(--gold-soft)}
.g-vmarco{position:relative;width:min(100%,280px);aspect-ratio:9/16;margin:2px auto 4px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.g-vmarco iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.g-sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.g-sets button{width:46px;height:46px;border-radius:10px;font-weight:700;font-size:13px}
.g-timer{margin-top:18px;padding-top:16px;border-top:1px solid rgba(184,150,62,.25);text-align:center}
.g-timer-lbl{font-family:var(--heroic);font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.g-reloj{font-family:var(--brandface);font-size:56px;line-height:1;color:var(--cream);margin:8px 0 14px;text-shadow:0 2px 0 rgba(0,0,0,.8)}
.g-reloj.corriendo{color:var(--gold-soft)}
.g-reloj.listo{color:var(--red)}
.g-tbtns{display:flex;gap:8px}
.g-ghost{flex:1;width:100%;padding:12px 8px;border-radius:10px;border:1px solid rgba(184,150,62,.35);background:none;color:var(--gold-soft);font-family:var(--heroic);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>

];
const SYMPTOMS=[
  {k:'calores',l:'Calores',e:'🔥'},{k:'sudores',l:'Sudores nocturnos',e:'💧'},{k:'sueno',l:'Mal sueño',e:'😴'},
  {k:'animo',l:'Cambios de ánimo',e:'💭'},{k:'fatiga',l:'Fatiga',e:'⚡'},{k:'articular',l:'Dolor articular',e:'🦴'},
  {k:'cabeza',l:'Dolor de cabeza',e:'🤕'},{k:'irritabilidad',l:'Irritabilidad',e:'😤'},{k:'bien',l:'Sin síntomas',e:'✨'},

const MF=[

  {k:'edad',l:'Años',u:'años'},{k:'altura',l:'Altura',u:'cm'},{k:'pecho',l:'Pecho',u:'cm'},
  {k:'cintura',l:'Cintura',u:'cm'},{k:'gluteo',l:'Glúteo',u:'cm'},{k:'imc',l:'IMC',u:''},

];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return '';return new Date(iso.length===10?iso+'T12:00:00':iso).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})}
// Días que faltan para pagado_hasta (negativo = ya venció; null = sin fecha)
function diasParaVencer(f){if(!f)return null;const h=new Date(today()+'T12:00:00'),v=new Date(String(f).slice(0,10)+'T12:00:00');return Math.round((v-h)/86400000)}
function getCycleDay(d){if(!d)return null;return Math.floor((Date.now()-new Date(d))/86400000)+5}
function getPhase(day,len){if(!day||day<1)return null;const d=((day-1)%(len||28))+1;return PHASES.find(p=>d>=p.r[0]&&d<=p.r[1])||PHASES[3]}
function ytId(url){if(!url)return null;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&?\/\s]{11})/);return m?m[1]:null}

let S={
  view:'login',tab:'hoy',loading:false,error:'',
  user:null,profile:null,prog:null,PROG:[],week:0,todaySchedule:null,todayExercises:[],upcomingSchedule:[],allSchedule:[],perfilExt:{},checkin:null,checkinDraft:{},motorTarjeta:null,escenario:'C',cargaLog:{},esfuerzoHecho:{},grupoData:null,variantes:{},sesionLibre:false,showBatchEsfuerzo:false,batchEsfuerzoExs:[],
  sessW:-1,sessI:-1,vidW:-1,vidS:-1,vidE:-1,completions:{},

  symLog:{},menoLog:{},selSym:[],symNote:'',

};
function set(u){Object.assign(S,u);render()}

// Botón con volumen, panel con esquinas doradas y títulos en Cinzel: el lenguaje visual de El Reino
const BTN_ROJO='background:linear-gradient(178deg,#D8503F 0%,#C7372C 42%,#8E1A12 100%);box-shadow:0 4px 0 -1px #5C0806,0 8px 16px -6px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.25)';
const PANEL='background:linear-gradient(178deg,#291E1D 0%,#221818 38%,rgba(22,15,14,.94) 100%);border:1px solid rgba(184,150,62,.22);box-shadow:inset 0 1px 0 rgba(242,233,220,.07),0 3px 0 -1px #100B0A,0 14px 24px -18px rgba(0,0,0,.85)';
const btnR=(t,fn)=>`<button class="btn-reino" onclick="${fn}" style="width:100%;padding:14px 16px;${BTN_ROJO};color:#fff;border:none;border-radius:10px;font-family:var(--heroic);font-weight:800;font-size:13px;letter-spacing:.12em">${t}</button>`;
const card=(i,s='')=>`<div class="panel-reino" style="${PANEL};border-radius:12px;padding:17px 16px;${s}"><span class="esq e1"></span><span class="esq e2"></span><span class="esq e3"></span><span class="esq e4"></span>${i}</div>`;
// Corona dorada de la marca (login, encabezado y carga)
const corona=(w,id)=>`<svg width="${w}" height="${Math.round(w*.75)}" viewBox="0 0 64 48" aria-hidden="true" style="display:block;filter:drop-shadow(0 2px 6px rgba(184,150,62,.35))">
  <defs><linearGradient id="cg-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3DE9A"/><stop offset=".55" stop-color="#C9A24A"/><stop offset="1" stop-color="#8A6A22"/></linearGradient></defs>

  <path d="M32 31 L35 35 L32 39 L29 35 Z" fill="#C7372C" stroke="#5C0806" stroke-width=".7"/>
  <circle cx="18" cy="40.5" r="1.6" fill="#710D0B"/><circle cx="46" cy="40.5" r="1.6" fill="#710D0B"/>
</svg>`;

function render(){
  const app=document.getElementById('app');if(!app)return;
  if(S.loading){app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:${C.bk}"><div style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px">${corona(56,"carga")}</div><p style="font-family:var(--heroic);letter-spacing:.2em;color:${C.g2};font-size:11px">CARGANDO…</p></div></div>`;return}
  if(S.view==='login'){app.innerHTML=rLogin();return}
  if(S.view==='no_prog'){app.innerHTML=rNoProg();return}
  if(S.view==='pausa'){app.innerHTML=rPausa();return}
  const tabs=[{k:'hoy',e:'📅',l:'Hoy'},{k:'ciclo',e:'🌙',l:'Ciclo'},{k:'rutinas',e:'💪',l:'Rutinas'},{k:'medidas',e:'📏',l:'Medidas'},{k:'nutri',e:'🍽',l:'Nutrición'}];
  app.innerHTML=`
    <div id="hdr" style="background:rgba(14,11,10,.94);backdrop-filter:blur(6px);padding:16px 18px 12px;position:sticky;top:0;z-index:20">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="display:flex;align-items:center;gap:7px">${corona(24,"enc")}<p style="font-family:var(--brandface);font-size:20px;letter-spacing:.16em;color:${C.gold};line-height:1">REINO</p></div>
          <p style="font-family:var(--voice);font-style:italic;font-weight:300;color:${C.td};font-size:15px;margin-top:3px">${S.profile&&S.profile.name?'Hola, '+esc(S.profile.name):'Bienvenida'}</p>
        </div>
        <div style="text-align:right">
          <button onclick="doLogout()" style="background:none;border:1px solid rgba(184,150,62,.3);color:${C.gs};padding:6px 12px;border-radius:8px;font-family:var(--heroic);font-size:9px;letter-spacing:.16em;font-weight:600">SALIR</button>
          <p style="color:${C.tl};font-size:9px;margin-top:5px;letter-spacing:.06em">v${APP_VERSION}</p>
        </div>
      </div>
    </div>
    ${S.view==='main'
      ?`<div id="tabsbar" style="display:flex;gap:4px;padding:0 10px;background:rgba(14,11,10,.94);border-bottom:1px solid rgba(184,150,62,.22);position:sticky;top:66px;z-index:20">
          ${tabs.map(t=>`<button onclick="abrirTab('${t.k}')" style="flex:1;padding:12px 0 11px;font-family:var(--heroic);font-weight:600;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;border:none;background:none;color:${S.tab===t.k?C.gs:C.tl};border-bottom:2px solid ${S.tab===t.k?C.gold:'transparent'}">${t.l}</button>`).join('')}
        </div>`
      :S.view==='guia'?'':`<div style="padding:10px 14px 12px;border-bottom:1px solid rgba(184,150,62,.22)">
          <button onclick="goBack()" style="background:none;border:1px solid rgba(184,150,62,.3);padding:7px 14px;border-radius:8px;font-family:var(--heroic);font-weight:600;font-size:10px;letter-spacing:.14em;color:${C.gs}">← VOLVER</button>
        </div>`}
    <div style="padding:13px 13px 50px">
      ${S.view==='main'&&S.tab==='hoy'?rHoy():S.view==='main'&&S.tab==='ciclo'?rCiclo()
       :S.view==='main'&&S.tab==='rutinas'?rRutinas()
       :S.view==='main'&&S.tab==='medidas'?rMedidas()
       :S.view==='main'&&S.tab==='nutri'?rNutri()
       :S.view==='comida'?rComidaForm()
       :S.view==='pform'?rPForm()
       :S.view==='sform'?rSForm()
       :S.view==='menoform'?rMenoForm()
       :S.view==='sess'?rSess()
       :S.view==='vid'?rVid()
       :S.view==='mform'?rMForm()
       :S.view==='fotos'?rFotos()
       :S.view==='guia'?rGuia():''}
    </div>`;
  // Las pestañas se pegan justo debajo del encabezado (su alto cambia con las fuentes)
  const hdr=document.getElementById('hdr'),tb=document.getElementById('tabsbar');
  if(S.view==='guia')guiaPintarReloj();
  if(S.view==='comida')previewComida();
  if(hdr&&tb){tb.style.top=hdr.offsetHeight+'px';if(document.fonts)document.fonts.ready.then(function(){tb.style.top=hdr.offsetHeight+'px'})}
  if(S.view==='main'&&S.tab==='ciclo'){
    const sl=document.getElementById('clen');

  }
}

// Acceso en pausa (estado 'pausada' desde el admin): sin rutinas hasta que Brayan la reactive
function rPausa(){
  const nom=S.profile&&S.profile.name?esc(S.profile.name.split(' ')[0]):'reina';
  return `

    <div style="display:flex;justify-content:center;margin-bottom:10px">${corona(56,"pausa")}</div>

const MONTH_ES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function currentProgWeek(lastBleeding, cycleLen){
  if(!lastBleeding) return 0;
  const cd=getCycleDay(lastBleeding);
  if(!cd) return 0;
  if(cd<=7) return 0;
  else if(cd<=14) return 1;
  else if(cd<=21) return 2;
  else return 3;
}

// ── CLASES EN VIVO CON INSCRIPCIÓN (Compañía/Corona) ─────────
// Horario semanal de Brayan (clases_horario) + inscripciones de ella. Máx. 3 por semana (lunes a domingo),
// esta semana y la siguiente; las reglas se validan en Supabase (inscribir_clase / cancelar_clase).
const DIAS_ABR=['dom','lun','mar','mie','jue','vie','sab'];
function horaBonita(h){const p=String(h||'').split(':'),H=+p[0],M=p[1]||'00';return (H%12||12)+':'+M+(H<12?' a. m.':' p. m.');}
function lunesDe(f){const d=new Date(f+'T12:00:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function claseHora(fecha,hora){return new Date(fecha+'T'+String(hora).slice(0,5)+':00');}
// El en vivo semanal viene en Premium y en VIP ("todo lo de Standard y Premium"): lo ven todas las clientas de la app
function veEnVivo(){const p=(S.perfilExt||{}).plan;return p==='presencial'||p==='compania'||p==='corona';}
function misClasesEn(fecha){const K=S.clases;if(!K)return [];return K.mias.filter(function(i){return i.fecha===fecha;});}
function horarioDe(id){return ((S.clases&&S.clases.horario)||[]).find(function(x){return x.id===id;});}
// Tarjeta(s) de hoy: su clase de corrección (si se inscribió) y el en vivo semanal (si es hoy)
function rClaseHoy(){
  const ahora=new Date(),vigente=function(hh){return claseHora(today(),hh.hora).getTime()+90*60000>ahora.getTime();};
  const items=misClasesEn(today()).map(function(i){return horarioDe(i.horario_id);}).filter(function(hh){return hh&&vigente(hh);}).map(function(hh){return{h:hh,t:'🎯 Hoy tienes clase con Brayan',d:'Te veo y te corrijo mientras entrenas tu rutina de hoy.'};});
  const hoyAb=DIAS_ABR[new Date(today()+'T12:00:00').getDay()];
  ((S.clases&&S.clases.horario)||[]).filter(function(hh){return hh.tipo==='en_vivo'&&veEnVivo()&&hh.dia===hoyAb&&vigente(hh);}).forEach(function(hh){items.push({h:hh,t:'📡 Hoy hay en vivo semanal',d:'Incluido en tu plan. No necesitas inscribirte.'});});
  return items.map(function(x){
    const link=x.h.link||(S.grupoData&&S.grupoData.zoom_url);
    return '<div style="'+PANEL+';border-color:rgba(199,55,44,.5);border-radius:14px;padding:18px;margin-bottom:12px;text-align:center">'
      +'<p style="font-weight:900;font-size:17px;color:#fff;margin-bottom:4px">'+x.t+'</p>'
      +'<p style="font-size:13px;color:'+C.g2+';margin-bottom:14px">A las '+horaBonita(x.h.hora)+' · '+x.d+'</p>'
      +(link?'<a href="'+esc(link)+'" target="_blank" style="display:block;padding:14px;'+BTN_ROJO+';color:#fff;border-radius:11px;font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:.12em;text-decoration:none">🔗 UNIRME</a>'
        :'<p style="font-size:13px;color:#fff;background:#2a2523;border-radius:10px;padding:11px">El link aparece aquí antes de que empiece.</p>')
      +'</div>';
  }).join('');
}
function rClasesVivo(){
  const K=S.clases;if(!K||!K.horario.length)return '';
  const ahora=new Date(),lun=lunesDe(today());
  let c='<p style="font-family:Cinzel,serif;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:'+C.gold+';margin-bottom:4px">🎥 Clases con Brayan</p>'
    +'<p style="font-size:12.5px;color:'+C.tm+';margin-bottom:6px">'+((S.perfilExt||{}).plan==='presencial'?'¿No podemos vernos en persona? Inscríbete a una clase donde te veo y te corrijo, hasta 2 por semana.':'Inscríbete hasta a 2 clases por semana donde te veo y te corrijo.')+' Te inscribes o cancelas hasta 10 horas antes de la clase.'+(veEnVivo()?' El en vivo semanal de tu plan va aparte y no necesita inscripción.':'')+'</p>';
  [0,7].forEach(function(off){
    // La próxima semana va plegada para no alargar Hoy (salvo que ya tenga clases ahí)
    if(off&&!S.verProxSemana&&!K.mias.some(function(i){return lunesDe(i.fecha)===sumarDias(lun,7);})){
      c+='<button onclick="S.verProxSemana=true;render()" style="width:100%;margin-top:10px;padding:9px;border-radius:10px;border:1px dashed rgba(184,150,62,.35);background:none;color:'+C.gs+';font-family:Cinzel,serif;font-size:10px;letter-spacing:.12em;font-weight:600">VER LA PRÓXIMA SEMANA</button>';
      return;
    }
    const ini=sumarDias(lun,off),dias=[];
    for(let d=0;d<7;d++){const f=sumarDias(ini,d);const ab=DIAS_ABR[new Date(f+'T12:00:00').getDay()];
      K.horario.filter(function(x){return x.dia===ab&&x.tipo!=='en_vivo';}).forEach(function(x){if(claseHora(f,x.hora)>ahora)dias.push({f:f,h:x});});}
    const mias=K.mias.filter(function(i){return lunesDe(i.fecha)===ini;}).length;
    c+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px"><p style="font-weight:800;font-size:13px;color:'+C.td+'">'+(off?'Próxima semana':'Esta semana')+'</p><p style="font-size:12px;color:'+(mias>=2?C.gs:C.tl)+'">'+mias+' de 2</p></div>';
    // En vivo semanal: incluido en Premium y VIP, sin inscripción ni límite
    for(let d=0;d<7;d++){const f=sumarDias(ini,d);const ab=DIAS_ABR[new Date(f+'T12:00:00').getDay()];
      K.horario.filter(function(x){return x.dia===ab&&x.tipo==='en_vivo'&&veEnVivo();}).forEach(function(x){
        if(claseHora(f,x.hora)<=ahora)return;
        const dd=new Date(f+'T12:00:00');

      // Las inscripciones cierran 10 horas antes (Brayan: a las 6 a. m. ya no alcanza a programarse si se inscriben de noche)
      else if(cerrada)b='<span style="font-size:11.5px;color:'+C.g2+'">Inscripción cerrada</span>';
      else if(mias>=2)b='<span style="font-size:11.5px;color:'+C.g2+'">Semana completa</span>';

// Convierte reps_range ("12–15 reps · Ligera / RPE 6 · 75s desc") en texto claro para la clienta.
// Devuelve {principal: "<b>3 series</b> de <b>12 a 15 repeticiones</b>", extras: ["Ligera","Descansa 75 segundos"], avisos: [...]}
function textoSeries(n,reps){
  const partes=String(reps||'').split('·').map(function(p){return p.trim();}).filter(Boolean);
  const primera=partes.shift()||'';
  const rango=function(a,b){return b?a+' a '+b:a;};
  const series='<b>'+n+(n===1?' serie':' series')+'</b>';
  let m,principal;
  if((m=primera.match(/^(\d+)\s*pasos/i))){
    principal=series+' de <b>'+m[1]+' pasos</b>';
  }else if((m=primera.match(/^(\d+)\s*(?:s|seg|segundos)\s*x\s*lado$/i))){
    principal=series+' de <b>'+m[1]+' segundos</b> por lado';
  }else if((m=primera.match(/^(\d+)\s*(?:s|seg|segundos)$/i))){
    principal='<b>'+n+(n===1?' ronda':' rondas')+'</b> de <b>'+m[1]+' segundos</b>';
  }else if((m=primera.match(/^(\d+)\s*(?:[–-]\s*(\d+))?\s*min/i))){
    const t=rango(m[1],m[2])+' minutos';
    principal=n>1?'<b>'+n+' veces</b> de <b>'+t+'</b>':'<b>'+t+'</b>';
  }else if((m=primera.match(/^(\d+)\s*(?:[–-]\s*(\d+))?\s*(x\s*lado|reps?)?/i))){
    principal=series+' de <b>'+rango(m[1],m[2])+' repeticiones</b>'+(m[3]&&/lado/i.test(m[3])?' por lado':'');
  }else{
    principal=series+(primera?' · '+esc(primera):'');
  }
  const extras=[],avisos=[];
  partes.forEach(function(p){
    let d;
    if(p.indexOf('⚠')===0){avisos.push(p.replace('⚠','').trim());return;}
    if((d=p.match(/^(\d+)\s*s\s*desc/i))){
      const sg=+d[1];
      extras.push('Descansa '+(sg>=60&&sg%60===0?(sg/60)+(sg===60?' minuto':' minutos'):sg+' segundos'));return;
    }
    const t=p.replace(/\/?\s*RPE\s*[\d–-]+/i,'').replace(/\bFC\b/,'pulsaciones').trim();
    if(t)extras.push(t.charAt(0).toUpperCase()+t.slice(1));
  });
  return {principal:principal,extras:extras,avisos:avisos};
}

// Lista de ejercicios tal como se muestra en la sesión: resuelta por escenario y filtrada por semáforo.
// rSess y rVid la usan igual para que el índice y el nombre del video coincidan con la lista.
function exListSesion(sess){
  const sem=(S.checkin&&S.checkin.semaforo)||'verde';
  const BLOQUES_ROJO=[1,2,5];
  // Regla de Brayan (2026-10-08): cada ejercicio con familia muestra SIEMPRE la versión del escenario elegido.
  // Gimnasio: versión C, o la de mancuernas si no hay C. Mancuernas: versión B. Solo cuerpo: versión A
  // (si no hay A de algo de gimnasio, la B). Se conservan series, reps, tempo e indicaciones.
  function resolverEx(ex){
    // Perimenopausia y menopausia: nunca saltos. El cardio de impacto alto pasa a su versión sin salto (escenario 'L').
    const sub=(S.perfilExt&&S.perfilExt.sub_perfil)||'';
    if(ex.impacto==='alto'&&ex.familia&&(sub==='perimenopausia'||sub==='menopausia')){
      const ss=S.variantes&&S.variantes[ex.familia+'_L'];
      if(ss)return Object.assign({},ex,{n:ss.n,v:ss.v||ex.v,desc:ss.d||null,impacto:'bajo',sustituido:true});
    }
    const esc2=S.escenario||'C';
    if(!ex.familia)return ex;
    const V=S.variantes||{};
    const f=ex.familia;
    const va=esc2==='C'?(V[f+'_C']||V[f+'_B'])
            :esc2==='B'?V[f+'_B']
            :(V[f+'_A']||(ex.equipo==='gimnasio'?V[f+'_B']:null));
    if(!va)return ex;
    const nota=(ex.n.match(/\(([^)]*)\)\s*$/)||[])[1];
    const base=ex.n.replace(/\s*\([^)]*\)\s*$/,'');
    if(va.n===base)return Object.assign({},ex,{desc:va.d||null});
    return Object.assign({},ex,{n:va.n+(nota?' ('+nota+')':''),v:va.v||ex.v,desc:va.d||null,carga_kg:null,sustituido:true});
  }
  let exList=(sess.ex||[]).map(resolverEx);
  // Nivel en el trabajo principal (no en recuperación activa): cambia repeticiones, peso/banda y descanso
  const nivel=(S.perfilExt&&S.perfilExt.nivel)||2;
  if(nivel!==2&&!/recuper/i.test(sess.type||''))exList=exList.map(function(ex){return ex.bloque===3?Object.assign({},ex,{reps:repsNivel(ex.reps,nivel)}):ex;});
  if(sem==='rojo')exList=exList.filter(function(ex){return !ex.bloque||BLOQUES_ROJO.indexOf(ex.bloque)>=0;});
  return exList;
}

// Series de un ejercicio según bloque, semáforo y nivel. La usan la lista de la sesión y el modo guiado.
function seriesEx(ex,sess){
  const sem=(S.checkin&&S.checkin.semaforo)||'verde';
  const isRecovSess=/recuper/i.test((sess&&sess.type)||'');
  const nivel=(S.perfilExt&&S.perfilExt.nivel)||2;
  let n=ex.sets||1;
  // Calentamiento y cierre: siempre las series escritas (sin nivel ni semáforo)
  if([1,2,5].indexOf(ex.bloque)>=0)return Math.max(1,n);
  // Cardio por nivel (Brayan 2026-10-27): principiante 4 rondas, intermedia 5, avanzada 6 (sobre las 5 programadas)
  if(ex.bloque===4)return Math.max(1,n+(nivel===3?1:nivel===1?-1:0));
  const esHoy=sess&&S.todaySchedule&&sess.id===S.todaySchedule.session_id;
  // Nivel (excepto sesiones de recuperación activa), Brayan 2026-10-27: todo ejercicio del trabajo principal,
  // programado con 2 o con 3 series, hace 3 en principiante, 4 en intermedia y 5 en avanzada
  if(!isRecovSess)n=Math.max(n,3)+(nivel-1);
  // Semáforo amarillo: −1 serie, salvo que el motor ya la haya pasado a una sesión Suave por ese amarillo
  if(sem==='amarillo'&&!(esHoy&&S.motivoHoy==='amarillo'))n=n-1;
  // Vuelta tras 8+ días sin entrenar: una serie menos en esa primera sesión
  if(esHoy&&S.motivoHoy==='vuelta_larga')n=n-1;
  return Math.max(1,n);
}
// Dosis por nivel en el trabajo principal (Brayan 2026-10-27): repeticiones del rango bajo/alto, peso o banda un
// escalón más liviano/pesado y descanso ±15 s. Intermedia = lo programado.
const ESCALA_PESO={'Muy ligera':['Muy ligera','Ligera'],'Ligera':['Muy ligera','Moderada'],'Moderada':['Ligera','Moderada'],
  'muy ligera':['muy ligera','ligera'],'ligera':['muy ligera','moderada'],'moderada':['ligera','moderada'],
  'Banda ligera':['Banda ligera','Banda media'],'Banda media':['Banda ligera','Banda fuerte'],'Banda fuerte':['Banda media','Banda fuerte']};
function repsNivel(reps,nivel){
  if(nivel!==1&&nivel!==3)return reps;
  const i=nivel===1?0:1;
  const partes=String(reps||'').split('·').map(function(p){return p.trim();});
  // Repeticiones: "10–12 reps" → 10 (principiante) o 12 (avanzada)
  partes[0]=partes[0].replace(/^(\d+)\s*[–-]\s*(\d+)/,function(_,a,b){return nivel===1?a:b;});
  for(let k=1;k<partes.length;k++){
    // Peso o banda un escalón (una sola sustitución por parte para no correr dos escalones)
    partes[k]=partes[k].replace(/Banda (ligera|media|fuerte)|Muy ligera|muy ligera|Moderada|moderada|Ligera|ligera/,function(m){return ESCALA_PESO[m]?ESCALA_PESO[m][i]:m;});
    // Descanso ±15 s (mínimo 30)
    partes[k]=partes[k].replace(/(\d+)\s*s\s*desc/i,function(_,s){return Math.max(30,(+s)+(nivel===1?15:-15))+'s desc';});
  }
  return partes.join(' · ');
}

// Un paso a la vez, como en El Reino: movilidad (reloj) → blindaje (lista) → un paso por ejercicio principal

// El reloj vive en GUIA y se pinta por id: render() no lo reinicia.
const GUIA={pasos:[],i:0,w:0,s:0,desdeHoy:false,vid:null,seg:0,fin:0,corre:false,listo:false,mostrar:false,lbl:'',timer:null,lock:null};

function segundosDosis(reps){
  const p=String(reps||'').split('·')[0].trim();
  let m=p.match(/^(\d+)(?:\s*[–-]\s*\d+)?\s*min/i);if(m)return +m[1]*60;
  m=p.match(/^(\d+)\s*(?:s|seg|segundos)\b/i);if(m)return +m[1]*(/lado/i.test(p)?2:1);
  return 0;
}
function descansoDe(reps){const m=String(reps||'').match(/(\d+)\s*s\s*desc/i);return m?+m[1]:0;}

function armarPasos(sess){
  const exs=exListSesion(sess),pasos=[];
  const de=function(b){return exs.filter(function(e){return b===3?(e.bloque===3||!e.bloque):e.bloque===b;});};
  de(1).forEach(function(ex){pasos.push({tipo:'tiempo',bloque:'Antes del entreno',titulo:ex.n,ex:ex,que:'Sigue el video a tu ritmo, sin carga y sin agitarte.'});});
  const b2=de(2);
  if(b2.length)pasos.push({tipo:'lista',bloque:'Antes del entreno',titulo:'Prepara tus articulaciones',lista:b2,que:'Toca cada uno para ver cómo se hace. Cuando termines todos, sigue.'});
  const b3=de(3);
  b3.forEach(function(ex,k){pasos.push({tipo:'fuerza',bloque:'Ejercicio '+(k+1)+' de '+b3.length+(ex.m?' · '+ex.m:''),titulo:ex.n,ex:ex});});
  de(4).forEach(function(ex){pasos.push({tipo:'cardio',bloque:'Sube pulsaciones',titulo:ex.n,ex:ex,que:'Subes el ritmo en el trabajo y respiras en el descanso. Con el cronómetro te guío.'});});
  de(5).forEach(function(ex){pasos.push({tipo:'tiempo',bloque:'Para terminar',titulo:ex.n,ex:ex,que:'Baja el ritmo: camina suave y respira.'});});
  pasos.push({tipo:'fin'});
  return pasos;
}

function entrenarGuiado(w,s,desdeHoy){
  const sess=S.PROG[w]&&S.PROG[w][s];if(!sess)return;
  guiaParar();
  Object.assign(GUIA,{pasos:armarPasos(sess),i:0,w:w,s:s,desdeHoy:!!desdeHoy,vid:null});
  try{if(!CRONO.ctx)CRONO.ctx=new (window.AudioContext||window.webkitAudioContext)();CRONO.ctx.resume();}catch(e){}
  try{if(navigator.wakeLock&&!GUIA.lock)navigator.wakeLock.request('screen').then(function(l){GUIA.lock=l;}).catch(function(){});}catch(e){}
  S.sessW=w;S.sessI=s;
  guiaEntrarPaso();
  set({view:'guia'});window.scrollTo(0,0);
}
function guiaHoy(){
  const tod=S.todaySchedule;if(!tod||!tod.session_id)return;
  let w=-1,s=-1;
  (S.PROG||[]).forEach(function(wk,wi){wk.forEach(function(se,si){if(se.id===tod.session_id){w=wi;s=si;}});});
  if(w>=0)entrenarGuiado(w,s,1);
}
function salirGuia(){
  guiaParar();
  try{if(GUIA.lock)GUIA.lock.release();}catch(e){}GUIA.lock=null;
  if(GUIA.desdeHoy)set({view:'main',tab:'hoy'});else set({view:'sess'});
}
function guiaIr(d){
  const p=GUIA.pasos[GUIA.i];
  // Al avanzar desde calentamiento o cierre, sus ejercicios quedan marcados como hechos
  if(d>0&&p&&(p.tipo==='tiempo'||p.tipo==='lista'))(p.lista||[p.ex]).forEach(guiaMarcarTodo);
  const n=GUIA.i+d;
  if(n<0||n>=GUIA.pasos.length)return;
  guiaParar();GUIA.i=n;GUIA.vid=null;guiaEntrarPaso();render();window.scrollTo(0,0);
}
function guiaMarcarTodo(ex){
  const sess=S.PROG[GUIA.w][GUIA.s],n=seriesEx(ex,sess);
  for(let k=0;k<n;k++)if(!S.completions[ex.eid+'_'+k])tSet(ex.eid,k,n);
}
function guiaEntrarPaso(){
  const p=GUIA.pasos[GUIA.i];
  GUIA.mostrar=false;GUIA.empezo=false;GUIA.lbl='';
  if(p&&p.tipo==='tiempo'){const sg=segundosDosis(p.ex.reps)||300;GUIA.seg=sg;GUIA.mostrar=true;GUIA.lbl='Tiempo';}
}
async function guiaSerie(btn){
  const eid=btn.dataset.eid,k=+btn.dataset.k,n=+btn.dataset.n;
  const yaHecha=!!S.completions[eid+'_'+k];
  await tSet(eid,k,n);
  const p=GUIA.pasos[GUIA.i];
  const quedan=Array.from({length:n},function(_,j){return S.completions[eid+'_'+j];}).filter(function(x){return !x;}).length;
  // Al marcar una serie (no la última) arranca solo el descanso
  if(!yaHecha&&quedan>0&&p&&p.ex&&p.tipo==='fuerza'){const d=descansoDe(p.ex.reps);if(d){guiaParar();GUIA.seg=d;GUIA.mostrar=true;GUIA.lbl='Descanso';guiaPlay();}}
  if(quedan===0){guiaParar();GUIA.mostrar=false;}
  render();
}
function guiaVideo(btn){GUIA.vid=GUIA.vid===btn.dataset.k?null:btn.dataset.k;render();}

// Reloj del paso: cuenta regresiva con pitidos (los de CRONO), sin repintar la pantalla
function guiaParar(){clearInterval(GUIA.timer);GUIA.timer=null;GUIA.corre=false;}
function guiaPlay(){
  const p=GUIA.pasos[GUIA.i],tiempo=p&&p.tipo==='tiempo';
  if(GUIA.corre){GUIA.seg=Math.max(0,Math.ceil((GUIA.fin-Date.now())/1000));guiaParar();guiaPintarReloj();return;}
  if(GUIA.seg<=0){if(tiempo)guiaIr(1);else{GUIA.mostrar=false;guiaPintarReloj();}return;}
  GUIA.corre=true;GUIA.empezo=true;cronoBeep(880,0.15);
  GUIA.fin=Date.now()+GUIA.seg*1000;
  GUIA.timer=setInterval(guiaTick,250);
  guiaPintarReloj();
}
function guiaTick(){
  const r=Math.max(0,Math.ceil((GUIA.fin-Date.now())/1000));
  if(r!==GUIA.seg){GUIA.seg=r;if(r>0&&r<=3)cronoBeep(880,0.1);}
  if(r<=0){
    guiaParar();
    cronoBeep(990,0.3);setTimeout(function(){cronoBeep(990,0.3);},400);setTimeout(function(){cronoBeep(990,0.6);},800);
    if(GUIA.lbl==='Descanso')GUIA.lbl='¡A la siguiente serie!';
  }
  guiaPintarReloj();
}
function guiaMas(){GUIA.seg+=15;if(GUIA.corre)GUIA.fin+=15000;guiaPintarReloj();}
function guiaPintarReloj(){
  const w=document.getElementById('g-timer');if(!w)return;
  w.style.display=GUIA.mostrar?'':'none';
  const r=document.getElementById('g-reloj'),b=document.getElementById('g-play'),l=document.getElementById('g-lbl');
  if(r){r.textContent=String(Math.floor(GUIA.seg/60)).padStart(2,'0')+':'+String(GUIA.seg%60).padStart(2,'0');r.className='g-reloj'+(GUIA.corre?' corriendo':GUIA.seg<=0?' listo':'');}
  if(l)l.textContent=GUIA.lbl;
  const p=GUIA.pasos[GUIA.i],tiempo=p&&p.tipo==='tiempo';
  if(b)b.textContent=GUIA.corre?'Pausar':GUIA.seg<=0?(tiempo?'Listo, sigue':'Cerrar'):GUIA.empezo?'Seguir':'Empezar';
}

function rGuia(){
  const P=GUIA.pasos,p=P[GUIA.i];
  const sess=S.PROG[GUIA.w]&&S.PROG[GUIA.w][GUIA.s];
  if(!p||!sess)return '';
  const vbtn=function(ex,k,txt,dosis){
    if(!ytId(ex.v))return '<p class="g-vsin">'+esc(ex.n)+(dosis?'<small class="g-dosis">'+dosis+'</small>':'')+'</p>';
    const ab=GUIA.vid===String(k);
    return '<button class="g-vbtn" data-k="'+k+'" aria-pressed="'+ab+'" onclick="guiaVideo(this)">'+txt+(dosis?'<small class="g-dosis">'+dosis+'</small>':'')+'</button>'
      +(ab?'<div class="g-vmarco"><iframe src="https://www.youtube-nocookie.com/embed/'+ytId(ex.v)+'?rel=0&playsinline=1&autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>':'');
  };
  let h='<div class="g-barra"><div class="g-relleno" style="width:'+Math.round((GUIA.i+1)/P.length*100)+'%"></div></div>';
  h+='<p class="g-paso">Paso '+(GUIA.i+1)+' de '+P.length+'</p>';
  let c='';
  if(p.tipo==='fin'){
    const tod=S.todaySchedule,esHoy=tod&&tod.session_id===sess.id,hecha=esHoy&&tod.status==='completed';
    c+='<div style="text-align:center;padding:8px 0"><div style="display:flex;justify-content:center;margin-bottom:12px">'+corona(64,'fin')+'</div>';
    c+='<p class="g-titulo" style="font-size:27px">TERMINASTE</p>';
    c+='<p style="font-family:var(--voice);font-style:italic;font-size:17px;color:var(--cream);margin-top:10px;line-height:1.5">Hoy cumpliste contigo, reina.</p>';
    if(esHoy&&!hecha)c+='<button onclick="markSessionDone()" class="btn-reino" style="width:100%;margin-top:18px;padding:15px;'+BTN_ROJO+';color:#fff;border:none;border-radius:12px;font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:.1em">♛ MARCAR SESIÓN COMPLETADA</button>';
    if(hecha)c+='<p style="margin-top:16px;font-weight:700;color:#4ADE80">✅ Sesión de hoy completada</p>';
    c+='</div>';
  } else {
    c+='<p class="g-bloque">'+esc(p.bloque)+'</p><p class="g-titulo">'+esc(p.tipo==='lista'?p.titulo:p.titulo)+'</p>';
    if(p.que)c+='<p class="g-que">'+esc(p.que)+'</p>';
    if(p.tipo==='lista'){
      c+='<div class="g-video g-lista">'+p.lista.map(function(ex,k){return vbtn(ex,k,'▶&nbsp; '+esc(ex.n),textoSeries(seriesEx(ex,sess),ex.reps).principal);}).join('')+'</div>';
    } else {
      const ex=p.ex,n=seriesEx(ex,sess),ts=textoSeries(n,ex.reps);
      if(ex.desc)c+='<p class="g-que" style="color:var(--cream)">'+esc(ex.desc)+'</p>';
      if(p.tipo!=='tiempo')c+='<p class="g-series">'+ts.principal+'</p>';
      if(ts.extras.length)c+='<div class="g-chips">'+ts.extras.map(function(x){return '<span class="g-chip">'+esc(x)+'</span>';}).join('')+'</div>';
      ts.avisos.forEach(function(a){c+='<p class="g-aviso">⚠ '+esc(a)+'</p>';});
      if(ex.cue)c+='<p class="g-cue">'+esc(ex.cue)+'</p>';
      c+='<div class="g-video">'+vbtn(ex,0,'▶ Ver cómo se hace','')+'</div>';
      if(p.tipo==='fuerza'||p.tipo==='cardio'){
        c+='<p class="g-timer-lbl" style="margin-top:18px">'+(p.tipo==='cardio'?'Rondas':'Marca cada serie al terminarla')+'</p><div class="g-sets">';
        for(let k=0;k<n;k++){
          const d=S.completions[ex.eid+'_'+k];
          c+='<button id="sb-'+ex.eid+'-'+k+'" data-eid="'+ex.eid+'" data-k="'+k+'" data-n="'+n+'" onclick="guiaSerie(this)" style="border:2px solid '+(d?C.pr:C.g3)+';background:'+(d?C.pr:C.wh)+';color:'+(d?'#fff':C.tl)+'">'+(d?'✓':'S'+(k+1))+'</button>';
        }
        c+='</div>';
      }
      if(p.tipo==='cardio'&&parseIntervalo(ex.reps))
        c+='<button data-eid="'+ex.eid+'" data-nombre="'+esc(ex.n)+'" data-rondas="'+n+'" data-reps="'+esc(ex.reps)+'" onclick="iniciarCrono(this)" class="btn-reino" style="width:100%;margin-top:14px;padding:14px;'+BTN_ROJO+';color:#fff;border:none;border-radius:11px;font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:.1em">⏱ INICIAR CRONÓMETRO</button>';
      // ¿Cómo se sintió? al terminar todas las series de un ejercicio principal (igual que en la lista)
      const todas=Array.from({length:n},function(_,k){return S.completions[ex.eid+'_'+k];}).every(Boolean);
      if(p.tipo==='fuerza'&&todas&&!/recuper/i.test(sess.type||'')&&!/movilidad|blindaje|activaci|respiraci|estiramiento|recuperaci/i.test((ex.n||'')+' '+(ex.m||''))){
        const efYa=S.esfuerzoHecho&&S.esfuerzoHecho[ex.eid];
        if(!efYa){
          c+='<p class="g-timer-lbl" style="margin-top:18px;margin-bottom:8px">¿Cómo se sintió?</p><div style="display:flex;gap:6px">';
          [{v:1,l:'Sobrada'},{v:2,l:'Justa'},{v:3,l:'Al límite'}].forEach(function(op){
            c+='<button data-eid="'+ex.eid+'" data-pat="'+esc(ex.patron||'')+'" data-fase="'+(getCurrentFase()||'presencial')+'" data-kg="'+(ex.carga_kg||'')+'" data-ef="'+op.v+'" onclick="efClick(this)" style="flex:1;padding:10px 4px;border-radius:8px;font-size:12px;font-weight:600;border:2px solid #E0C97F;background:rgba(184,150,62,.12);color:#E0C97F">'+op.l+'</button>';
          });
          c+='</div>';
        } else c+='<p style="margin-top:14px;text-align:center;font-size:13px;font-weight:700;color:#E0C97F">✓ '+({1:'Sobrada',2:'Justa',3:'Al límite'}[efYa]||'Registrado')+'</p>';
      }
    }
    // Reloj (movilidad, cierre y descansos)
    c+='<div class="g-timer" id="g-timer" style="display:none"><p class="g-timer-lbl" id="g-lbl"></p><div class="g-reloj" id="g-reloj">00:00</div>'
      +'<div class="g-tbtns"><button class="g-ghost" id="g-play" onclick="guiaPlay()">Empezar</button><button class="g-ghost" onclick="guiaMas()">+15 seg</button></div></div>';
  }
  h+=card(c,'margin-top:14px');
  const ult=GUIA.i===P.length-2;
  if(p.tipo==='fin')h+='<button onclick="salirGuia()" class="btn-reino" style="width:100%;margin-top:18px;padding:14px;'+BTN_ROJO+';color:#fff;border:none;border-radius:11px;font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:.12em">VOLVER</button>';
  else h+='<button onclick="guiaIr(1)" class="btn-reino" style="width:100%;margin-top:18px;padding:15px;'+BTN_ROJO+';color:#fff;border:none;border-radius:11px;font-family:Cinzel,serif;font-weight:700;font-size:14px;letter-spacing:.14em">'+(ult?'ÚLTIMO PASO':'SIGUIENTE')+'</button>';
  if(GUIA.i>0)h+='<button class="g-ghost" style="margin-top:10px" onclick="guiaIr(-1)">Anterior</button>';
  if(p.tipo!=='fin')h+='<button class="g-ghost" style="margin-top:10px" onclick="salirGuia()">Salir del entreno</button>';
  return h;
}

// ── MI ANTES Y DESPUÉS ───────────────────────────────────────
// Mismo flujo y textos que El Reino. Fotos en el bucket privado "fotos" de Supabase,
// carpeta = id de la clienta ({id}/antes-frente.jpg …). Fila en fotos_clientas: permiso y fechas.
// La foto de los 3 meses se abre 90 días después de la primera foto de antes.
const FOTOS={
  guia:[
    'Reina, en tres meses vas a querer compararte, y la memoria engaña.',
    'Toma 4 fotos: de frente, de lado derecho, de lado izquierdo y de espaldas.',
    'Párate natural, como estás un día cualquiera. En la foto de antes casi todas buscan la "buena foto": meten la panza, buscan el ángulo y esconden el godito. Esta es justo la foto para mostrarlo todo, porque de ahí arranca tu cambio.',
    'Usa ropa ajustada, top y licra o short, para que se vea la forma de tu cuerpo. Busca buena luz y saca el cuerpo completo.',
    'Guarda ese lugar y esa ropa para tu foto de los 3 meses.'
  ],
  permisos:[{id:'con_cara',texto:'Puedes publicarlas con mi cara'},{id:'sin_cara',texto:'Puedes publicarlas tapando mi cara'}],
  lados:[{id:'frente',texto:'De frente'},{id:'derecho',texto:'Lado derecho'},{id:'izquierdo',texto:'Lado izquierdo'},{id:'espalda',texto:'De espaldas'}],
  dias_despues:90
};
const rutaFoto=(uid,mom,lado)=>uid+'/'+mom+'-'+lado+'.jpg';
const fechaLarga=d=>d.toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});

function fotosPermitidas(){return !esMenor()||!!S.consFotos;}
async function abrirFotos(){
  if(!fotosPermitidas())return;
  set({view:'fotos',fotos:{cargando:true,urls:{},fila:null,aviso:''}});
  await cargarFotos();
}
async function cargarFotos(aviso){
  const uid=S.user.id;let fila=null;const urls={};let err='';
  try{
    const r=await sb.from('fotos_clientas').select('*').eq('id',uid).maybeSingle();
    if(r.error)throw r.error;
    fila=r.data||null;
    const rutas=[];['antes','despues'].forEach(function(m){FOTOS.lados.forEach(function(l){rutas.push(rutaFoto(uid,m,l.id));});});
    const f=await sb.storage.from('fotos').createSignedUrls(rutas,3600);
    ((f&&f.data)||[]).forEach(function(x){if(x.signedUrl&&!x.error)urls[x.path]=x.signedUrl;});
  }catch(e){console.error(e);err='No pude cargar tus fotos. Revisa tu conexión e intenta de nuevo.';}
  set({fotos:{cargando:false,fila:fila,urls:urls,aviso:err||aviso||''}});
}
function abreDespues(fila){
  if(!fila||!fila.antes_fecha)return null;
  const d=new Date(String(fila.antes_fecha).slice(0,10)+'T00:00:00');d.setDate(d.getDate()+FOTOS.dias_despues);return d;
}
function rFotos(){
  const F=S.fotos||{};
  if(F.cargando)return card('<p style="text-align:center;color:'+C.tl+';padding:20px 0">Cargando tus fotos...</p>');
  const uid=S.user.id,fila=F.fila,permiso=fila&&fila.permiso;
  const abre=abreDespues(fila),abierto=!!abre&&new Date()>=abre;
  let h='<p style="font-family:Cinzel,serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.24em;color:'+C.gold+';margin:4px 0 4px">Mi antes y después</p>';
  h+='<p style="font-family:Fraunces,serif;font-size:17px;font-style:italic;color:'+C.td+';margin-bottom:12px">Tu punto de partida y tu cambio a los 3 meses.</p>';
  h+=card('<p style="font-weight:900;font-size:15px;letter-spacing:.06em;color:'+C.td+';margin-bottom:6px">CÓMO TOMARLAS</p>'+
    FOTOS.guia.map(function(t){return '<p style="font-size:13.5px;color:'+C.tm+';line-height:1.6;margin-top:8px">'+esc(t)+'</p>';}).join(''),'margin-bottom:12px');
  let perm='<p style="font-weight:900;font-size:15px;letter-spacing:.06em;color:'+C.td+';margin-bottom:4px">TU PERMISO</p>';
  perm+='<p style="font-size:13px;color:'+C.tl+';margin-bottom:10px">Estas fotos son para mostrar tu cambio. Escoge cómo las podemos publicar antes de subirlas.</p>';
  FOTOS.permisos.forEach(function(p){
    const sel=permiso===p.id;
    perm+='<button data-p="'+p.id+'" onclick="guardarPermiso(this)" style="display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border-radius:11px;font-size:14px;font-weight:'+(sel?800:600)+';border:2px solid '+(sel?C.pr:C.g3)+';background:'+(sel?'rgba(199,55,44,.16)':C.wh)+';color:'+(sel?C.pr:C.td)+'">'+(sel?'✓ ':'')+esc(p.texto)+'</button>';
  });
  h+=card(perm,'margin-bottom:12px');
  function grid(mom,habil){
    let g='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
    FOTOS.lados.forEach(function(l){
      const url=F.urls[rutaFoto(uid,mom,l.id)];
      g+='<button data-mom="'+mom+'" data-lado="'+l.id+'" onclick="elegirFoto(this)" '+(habil?'':'disabled')+' style="position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:2px dashed '+(url?'transparent':C.g3)+';background:'+(habil?'rgba(242,233,220,.06)':'rgba(242,233,220,.03)')+';opacity:'+(habil?1:.55)+';padding:0">';
      g+=url?'<img src="'+url+'" alt="'+esc(l.texto)+'" style="width:100%;height:100%;object-fit:cover;display:block">':'<span style="font-size:30px;color:'+C.g2+'">+</span>';
      g+='<span style="position:absolute;left:0;right:0;bottom:0;padding:7px 4px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))">'+esc(l.texto)+(url?' · cambiar':'')+'</span></button>';
    });
    return g+'</div>';
  }
  h+=card('<p style="font-weight:900;font-size:15px;letter-spacing:.06em;color:'+C.td+';margin-bottom:4px">ANTES</p><p style="font-size:13px;color:'+C.tl+';margin-bottom:10px">Antes de tu primer entreno.</p>'+grid('antes',!!permiso),'margin-bottom:12px');
  const nota=!abre?'Se abre 3 meses después de tu foto de antes.':abierto?'Ya te toca. Usa el mismo lugar y la misma ropa de tu foto de antes.':'Se abre el '+fechaLarga(abre)+'.';
  h+=card('<p style="font-weight:900;font-size:15px;letter-spacing:.06em;color:'+C.td+';margin-bottom:4px">A LOS 3 MESES</p><p style="font-size:13px;color:'+C.tl+';margin-bottom:10px">'+nota+'</p>'+grid('despues',!!permiso&&abierto),'margin-bottom:12px');
  const aviso=F.aviso||(!permiso?'Primero escoge tu permiso, y ahí se habilitan las fotos.':'');
  if(aviso)h+='<p style="font-size:13px;text-align:center;color:'+C.tm+';background:'+C.wh+';border-radius:10px;padding:10px">'+esc(aviso)+'</p>';
  return h;
}
async function guardarPermiso(btn){
  const p=btn.dataset.p,F=S.fotos||{};
  const fila=Object.assign({},F.fila||{},{id:S.user.id,permiso:p});

// La foto se achica en el celular antes de subirla: lado largo 1280 px, JPEG ~200 KB
function comprimirFoto(file){
  return new Promise(function(ok,mal){
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?ok(b):mal(new Error('sin imagen'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);mal(new Error('formato'));};
    img.src=url;
  });
}

// Límite de calorías del día (aprobado por Brayan 2026-10-24):
// metabolismo en reposo de la báscula (RM) × actividad diaria sin entreno (sedentaria 1.2, ligera 1.3 por defecto, activa 1.45)
// + entreno SOLO si marcó la sesión de hoy como completada, según su intensidad real (entrenoHoy)
// + objetivo único: recomposición. Con 35% de grasa o más (y mayor de edad): −10%, nunca por debajo del RM.
// + 150 kcal en menguante A y B. Sin RM: fórmula Mifflin-St Jeor con peso, altura y edad.
// Menores de edad: ven sus calorías y su límite (Brayan), siempre a mantenimiento, sin déficit.
function datoMed(k){const m=(S.meas||[]).find(function(x){return x[k]!==null&&x[k]!==undefined&&x[k]!=='';});return m?parseFloat(m[k]):null;}

function sesionDeHoy(){
  const t=S.todaySchedule;if(!t||!t.session_id)return null;
  let r=null;(S.PROG||[]).forEach(function(wk){wk.forEach(function(s){if(s.id===t.session_id)r=s;});});
  return r;
}
// Gasto del entreno según la intensidad: principal 250, integradora 200, suave 150, recuperación 80.
// Semáforo amarillo (una serie menos) −15%; rojo (solo movilidad, blindaje y cierre) = 80.
// Con real=true cuenta solo la parte de las series del trabajo principal y el cardio que marcó (mínimo 30%);
// si marcó la sesión completa sin marcar series, cuenta completa.
function entrenoHoy(real){
  const s=sesionDeHoy();if(!s)return 0;
  const tipo=s.type||'';
  let base=/recuper/i.test(tipo)?80:/integradora/i.test(tipo)?200:/suave/i.test(tipo)?150:/principal/i.test(tipo)?250:0;
  if(!base)return 0;
  const sem=(S.checkin&&S.checkin.semaforo)||'verde';
  if(sem==='rojo')return 80;
  if(sem==='amarillo'&&base>80)base*=0.85;
  if(real&&base>80){
    let tot=0,hechas=0;
    exListSesion(s).filter(function(e){return e.bloque===3||e.bloque===4||!e.bloque;}).forEach(function(e){
      const n=seriesEx(e,s);tot+=n;for(let k=0;k<n;k++)if(S.completions[e.eid+'_'+k])hechas++;
    });
    if(tot&&hechas)base*=Math.max(0.3,hechas/tot);
  }

function limiteKcal(){
  let rm=datoMed('rm_kcal');
  if(!rm){const pe=datoMed('peso'),al=datoMed('altura'),ed=datoMed('edad');if(!(pe&&al&&ed))return null;rm=10*pe+6.25*al-5*ed-161;}
  const p=S.perfilExt||{};
  const fact={sedentaria:1.2,ligera:1.3,activa:1.45}[p.actividad]||1.3;
  const hecha=!!(S.todaySchedule&&S.todaySchedule.status==='completed');
  const fat=datoMed('fat_pct'),deficit=!esMenor()&&fat!==null&&fat>=35;
  const c=cicloHoy(),lutea=c&&c.ruta==='lunar'&&(c.fase==='menguante_a'||c.fase==='menguante_b')?150:0;
  const calc=function(ent){const g=rm*fact+ent;return Math.round((deficit?Math.max(rm,g*0.90):g)+lutea);};
  const lim=calc(hecha?entrenoHoy(true):0);
  return{lim:lim,pendiente:hecha?0:calc(entrenoHoy(false))-lim};
}
// Proteína del día (aprobada por Brayan 2026-10-24): 2.0 g por kg de peso (+0.2 en menguante A/B, +0.2 en peri y
// menopausia; tope 2.2). Con 40% de grasa o más: 2.4 g por kg de masa libre de grasa (peso × (1 − %grasa)), mismas sumas, tope 2.6.
function proteinaMeta(){
  const peso=datoMed('peso');if(!peso)return null;
  const fat=datoMed('fat_pct'),p=S.perfilExt||{},c=cicloHoy();
  let extra=0;
  if(c&&c.ruta==='lunar'&&(c.fase==='menguante_a'||c.fase==='menguante_b'))extra+=0.2;
  if(p.sub_perfil==='perimenopausia'||p.sub_perfil==='menopausia')extra+=0.2;
  if(fat!==null&&fat>=40)return Math.round(peso*(1-fat/100)*Math.min(2.6,2.4+extra));

}

// Día y fase de hoy con la misma cuenta que generar_motor (SQL): desde el primer día del período (ancla),
// proyectando ciclos de duracion_ciclo días. Lo usan la pestaña Ciclo, el esfuerzo y la carga.
function cicloHoy(fecha){
  const p=S.perfilExt;
  if(!p||!p.ancla)return null;
  const dias=Math.floor((new Date((fecha||today())+'T00:00:00')-new Date(p.ancla+'T00:00:00'))/86400000);
  if(dias<0)return null;
  if(p.ruta==='energia'){const d=(dias%28)+1;return{ruta:'energia',dia:d,fase:'semana_'+Math.ceil(d/7)};}
  const dur=p.duracion_ciclo||28,d=(dias%dur)+1;
  return{ruta:'lunar',dia:d,dur:dur,fase:mapearFaseLunar(d,dur).fase};
}
function getCurrentFase(){
  if(S.motorTarjeta&&S.motorTarjeta.fase)return S.motorTarjeta.fase;
  const c=cicloHoy();
  return c?c.fase:null;
}

function sugerirKg(lastLog, baseKg){
  if(!lastLog||!lastLog.kg)return baseKg||null;
  if(lastLog.esfuerzo===1){
    const step=lastLog.kg<10?1.25:lastLog.kg<20?2.5:5;
    return Math.round((lastLog.kg+step)*2)/2;
  }
  return lastLog.kg;
}

function mapearFaseLunar(dia,dur){
  if(dur<22||dur>40)return{fase:'menguante_b',orden:1};
  const r={
    luna_nueva:[1,5],
    creciente:[6,dur-15],
    llena:[dur-14,dur-12],
    menguante_a:[dur-11,dur-5],
    menguante_b:[dur-4,dur]
  };
  const mx={luna_nueva:5,creciente:8,llena:3,menguante_a:7,menguante_b:5};
  for(const[f,[ini,fin]]of Object.entries(r)){
    if(dia>=ini&&dia<=fin){
      const orden=((dia-ini)%mx[f])+1;
      return{fase:f,orden};
    }
  }
  return{fase:'menguante_b',orden:1};
}

async function calcularTarjetaMotor(perfil,userId,fecha){
  if(!perfil.ancla)return null;
  const ancla=new Date(perfil.ancla+'T00:00:00');
  const hoy=new Date(fecha+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  let fase,orden;
  if(perfil.ruta==='energia'){
    const db=(dias%28)+1;
    fase='semana_'+Math.ceil(db/7);
    orden=((db-1)%7)+1;
  } else {
    // Igual que generar_motor: si el período se atrasa, se proyecta el ciclo siguiente
    const dur=perfil.duracion_ciclo||28;
    const r=mapearFaseLunar((dias%dur)+1,dur);
    fase=r.fase;orden=r.orden;
  }
  const ruta=perfil.ruta||'lunar';
  const{data}=await sb.from('plantilla_tarjetas')
    .select('*,plantillas!inner(nombre,ruta,activa)')
    .eq('fase',fase).eq('orden',orden)
    .eq('plantillas.ruta',ruta).eq('plantillas.activa',true)
    .maybeSingle();
  return{fase,orden,ruta,tarjeta:data||null};
}

// "Me llegó el período" (Hoy) y "Mi período" (Ciclo) hacen lo mismo.
// Ruta lunar: el primer día del período pasa a ser el ancla y las rutinas pendientes del motor se recalculan
// desde hoy (manuales y completadas no se tocan).
// Ruta energía (irregular, perimenopausia): SOLO se registra el sangrado (plato de esos días e historial).
// Su bloque de 4 semanas no depende del período y no se toca (Brayan 2026-10-22).
async function registrarPeriodo(fecha,tab){
  const userId=S.user.id;
  const lunar=S.perfilExt.ruta==='lunar';
  set({loading:true});
  try{
    if(lunar){
      const pR=await sb.from('profiles').update({ancla:fecha}).eq('id',userId);
      if(pR.error)throw pR.error;
    }
    const cR=await sb.from('cycle_logs').insert({client_id:userId,last_bleeding_date:fecha,cycle_length:S.perfilExt.duracion_ciclo||28});
    if(cR.error)throw cR.error;
    if(lunar){
      const rg=await sb.rpc('regenerar_motor',{p_client:userId,p_desde:today()});
      if(rg.error)console.error(rg.error);
    }
  }catch(e){
    console.error(e);
    set({loading:false,view:'main'});
    alert('No se pudo registrar el período. Intenta de nuevo.');
    return;
  }
  await loadClientData();
  if(tab)set({tab:tab});
}
function marcarPeriodo(){return registrarPeriodo(today());}

// ── MOTOR ADAPTATIVO (aprobado por Brayan 2026-10-27) ────────
// El ciclo pone el techo y la intención; lo que ella registra escoge la sesión del día. Orden (la primera que aplica):
//  1. Semáforo rojo → Recuperación Activa.
//  2. 3 días seguidos entrenados → el 4.º, Recuperación.
//  3. Amarillo → Suave.
//  4. Luna nueva días 1–2 (o sangrado de irregular/peri días 1–2) SIN check-in → Suave (manda el ciclo).
//  5. Le toca Recuperación y lleva 2+ días sin entrenar → sesión media. 2–7 días sin entrenar → media.
//     8+ días → media y una serie menos (primera sesión de vuelta).
//  6. Verde + energía "Encendida" → Principal (media en luna nueva, menguante B y semana 4; alta en las demás).
//     Freno: máximo 3 subidas por semana. Peri/menopausia: nunca 3 Principales en alta seguidas (la 3.ª va en media).
//  7. Si nada aplica → la sesión del calendario.
// "Entrenado" = día con la sesión marcada como completada (ella en la app o Brayan con "Asistió").
// Solo cambia la fila de HOY del motor, pendiente y sin series marcadas (ajustar_sesion_hoy). Lo manual no se toca.
let MOTOR_DESDE='2026-10-26';   // el historial cuenta desde el arranque del motor adaptativo
const NIVEL_TIPO={R:0,S:1,I:2,P:3},NIVEL_CARGA={tecnica:0,media:1,alta:2};
function tipoSesion(st){st=st||'';return /recuper/i.test(st)?'R':/integradora/i.test(st)?'I':/suave/i.test(st)?'S':/principal/i.test(st)?'P':'';}
function cargaDe(sessionId,fecha){
  const c=cicloHoy(fecha),T=(S.motor&&S.motor.tarjetas)||[];
  const t=T.find(function(x){return x.session_id===sessionId&&c&&x.fase===c.fase;})||T.find(function(x){return x.session_id===sessionId;});
  return t?t.carga:'media';
}
function elegirSesion(tipo,carga,fase,evitar){
  const T=((S.motor&&S.motor.tarjetas)||[]).filter(function(t){return t.tipo===tipo;});
  const filtros=[function(t){return t.fase===fase&&t.carga===carga;},function(t){return t.carga===carga;},function(t){return t.fase===fase;},function(){return true;}];
  for(let i=0;i<filtros.length;i++){
    const ids=[];T.filter(filtros[i]).forEach(function(t){if(ids.indexOf(t.session_id)<0)ids.push(t.session_id);});
    if(!ids.length)continue;
    const L=ids.filter(function(id){return id!==evitar;});const lista=L.length?L:ids;
    const n=Math.floor(new Date(today()+'T12:00:00').getTime()/86400000);
    return lista[n%lista.length];
  }
  return null;
}
function decidirSesionHoy(){
  const t=S.todaySchedule,M=S.motor;
  if(!t||!t.session_id||!M)return null;
  const base=t.session_original||t.session_id;
  const baseSess=M.sesiones[base];if(!baseSess)return null;
  const c=cicloHoy();if(!c)return null;
  const p=S.perfilExt||{},peri=p.sub_perfil==='perimenopausia'||p.sub_perfil==='menopausia';
  const baseTipo=tipoSesion(baseSess.session_type),baseCarga=cargaDe(base);
  const hist={};(M.hist||[]).forEach(function(h){hist[h.fecha]=h;});
  const hecho=function(f){return hist[f]&&hist[f].status==='completed';};
  // días seguidos entrenados (sin contar recuperación) que terminan ayer
  let seguidos=0;for(let d=1;d<=7;d++){const f=sumarDias(today(),-d),h=hist[f];if(h&&h.status==='completed'&&h.tipo!=='R')seguidos++;else break;}
  // días completos sin entrenar antes de hoy (el arranque del motor cuenta como último día entrenado)
  let ultimo=MOTOR_DESDE;(M.hist||[]).forEach(function(h){if(h.status==='completed'&&h.fecha<today()&&h.fecha>ultimo)ultimo=h.fecha;});
  const sinEntrenar=Math.max(0,Math.round((new Date(today()+'T12:00:00')-new Date(ultimo+'T12:00:00'))/86400000)-1);
  // subidas por "Encendida" esta semana (lunes a ayer)
  const lun=lunesDe(today());
  const subidas=(M.hist||[]).filter(function(h){return h.fecha>=lun&&h.fecha<today()&&h.ajuste==='encendida';}).length;
  const ck=S.checkin,sem=ck&&ck.semaforo,enc=ck&&ck.energia===3&&sem==='verde';
  const sangrado12=c.ruta==='energia'&&S.cycleHistory&&S.cycleHistory[0]&&(function(){const d=Math.round((new Date(today()+'T12:00:00')-new Date(S.cycleHistory[0].last_bleeding_date+'T12:00:00'))/86400000);return d>=0&&d<=1;})();
  const lunaNueva12=(c.ruta==='lunar'&&c.fase==='luna_nueva'&&c.dia<=2)||sangrado12;
  const faseBaja=['luna_nueva','menguante_b','semana_4'].indexOf(c.fase)>=0;
  const ayer=sumarDias(today(),-1),evitar=hist[ayer]&&hist[ayer].session_id;
  // Sesión de intensidad media para volver: Principal media si le tocaba Principal (creciente, ruta energía);
  // si no, Integradora media (luna nueva, llena, menguantes). Nunca la misma de ayer si hay otra.
  const media=function(){
    const orden=baseTipo==='P'?['P','I']:['I','P'];
    for(let k=0;k<orden.length;k++){const s=elegirSesion(orden[k],'media',c.fase,evitar);if(s&&s!==evitar)return s;}
    return elegirSesion(orden[0],'media',c.fase,null)||elegirSesion(orden[1],'media',c.fase,null);
  };
  const r=function(sid,aj){return{session_id:sid||base,ajuste:sid&&sid!==base?aj:null,motivo:aj};};
  if(sem==='rojo')return r(baseTipo==='R'?base:elegirSesion('R','tecnica',c.fase,null),'rojo');
  if(seguidos>=3)return r(baseTipo==='R'?base:elegirSesion('R','tecnica',c.fase,null),'recuperacion_4');
  if(sem==='amarillo')return r(NIVEL_TIPO[baseTipo]<=1?base:elegirSesion('S','media',c.fase,evitar),'amarillo');
  if(!ck&&lunaNueva12)return r(NIVEL_TIPO[baseTipo]<=1?base:elegirSesion('S','tecnica',c.fase,evitar),'amarillo');
  if(baseTipo==='R'&&sinEntrenar>=2)return r(media(),'sin_entreno_recup');
  if(sinEntrenar>=8)return r(media(),'vuelta_larga');
  if(sinEntrenar>=2)return r(media(),'vuelta_media');
  if(enc){
    let carga=faseBaja?'media':'alta';
    // Peri/menopausia: si los 2 días entrenados anteriores fueron Principal en alta, la 3.ª va en media
    if(peri&&carga==='alta'){
      const f1=sumarDias(today(),-1),f2=sumarDias(today(),-2);
      const alta=function(f){const h=hist[f];return h&&h.status==='completed'&&h.tipo==='P'&&cargaDe(h.session_id,f)==='alta';};
      if(alta(f1)&&alta(f2))carga='media';
    }
    const sube=NIVEL_TIPO.P*3+NIVEL_CARGA[carga]>NIVEL_TIPO[baseTipo]*3+(NIVEL_CARGA[baseCarga]||0);
    if(!sube)return r(base,null);
    if(subidas>=3)return{session_id:base,ajuste:null,motivo:'freno'};
    return r(elegirSesion('P',carga,c.fase,evitar),carga==='media'&&peri&&!faseBaja?'peri_freno':'encendida');
  }
  // Peri/menopausia también con la sesión del calendario: nunca 3 Principales en alta seguidas
  if(peri&&baseTipo==='P'&&baseCarga==='alta'){
    const alta=function(f){const h=hist[f];return h&&h.status==='completed'&&h.tipo==='P'&&cargaDe(h.session_id,f)==='alta';};
    if(alta(sumarDias(today(),-1))&&alta(sumarDias(today(),-2)))return r(elegirSesion('P','media',c.fase,evitar),'peri_freno');
  }
  return r(base,null);
}

// Aplica la decisión: al abrir la app y cada vez que guarda o cambia el check-in
async function aplicarMotor(){
  try{
    const t=S.todaySchedule;
    if(!t||t.origen!=='motor'||(t.status&&t.status!=='pending')||!S.motor)return;
    // Si ya marcó series de la sesión de hoy, no se cambia a mitad de entreno
    const s=sesionDeHoy();
    if(s&&s.ex.some(function(e){return Object.keys(S.completions).some(function(k){return k.indexOf(e.eid+'_')===0;});}))return;
    const d=decidirSesionHoy();if(!d)return;
    S.motivoHoy=d.motivo;
    if(d.session_id!==t.session_id){
      const res=await sb.rpc('ajustar_sesion_hoy',{p_session:d.session_id,p_ajuste:d.ajuste});
      if(res.error){console.error('motor:',res.error.message);return;}
      if(res.data!=='ok')return;
      await cargarSesionEnProg(d.session_id);
      S.todaySchedule=Object.assign({},t,{session_original:t.session_original||t.session_id,session_id:d.session_id,ajuste:d.ajuste});
    }
    render();
  }catch(e){console.error(e);}
}

function calcularSemaforo(energia,animo,molestias,sueno){
  const puntos=energia+animo+sueno+(4-molestias); // rango 4..12
  if(puntos<=6)return 'rojo';
  if(puntos<=9)return 'amarillo';
  return 'verde';
}

async function guardarCheckin(energia,animo,molestias,sueno,semaforoManual){
  const semaforo=semaforoManual||calcularSemaforo(energia,animo,molestias,sueno);
  const{data}=await sb.from('checkins')
    .upsert({
      client_id:S.user.id,fecha:today(),
      energia,animo,molestias,sueno,semaforo,
      updated_at:new Date().toISOString()
    },{onConflict:'client_id,fecha'})
    .select().single();
  set({checkin:data||{semaforo,energia,animo,molestias,sueno},checkinDraft:{}});
  aplicarMotor();
}

async function borrarCheckin(){
  await sb.from('checkins')
    .delete()
    .eq('client_id',S.user.id)
    .eq('fecha',today());
  set({checkin:null,checkinDraft:{}});
  aplicarMotor();
}

function seleccionarCheckin(campo,valor){

  S.checkinDraft=draft;
  if(draft.energia&&draft.animo&&draft.molestias!==undefined&&draft.sueno){
    guardarCheckin(draft.energia,draft.animo,draft.molestias,draft.sueno);
  } else {

async function ajustarSemaforo(dir){
  const orden=['rojo','amarillo','verde'];
  const actual=(S.checkin&&S.checkin.semaforo)||'amarillo';
  const idx=orden.indexOf(actual);
  const nuevo=orden[Math.max(0,Math.min(2,idx+dir))];
  const c=S.checkin||{};
  await guardarCheckin(c.energia,c.animo,c.molestias,c.sueno,nuevo);
}

      clases={horario:(hr&&hr.data)||[],mias:(mr&&mr.data)||[]};}catch(e){console.error(e);}
  }
  // Load grupo if client has one (Compañía / Corona)
  let grupoData=null;
  if(perfilExt.grupo_id){
    const gR=await sb.from('grupos').select('*').eq('id',perfilExt.grupo_id).single();
    grupoData=gR.data||null;
  }
  // Load carga history for current phase
  const faseHoy=getCurrentFase?getCurrentFase():null;
  let cargaLog={};
  if(faseHoy&&userId){
    const clR=await sb.from('carga_log').select('exercise_id,patron,escenario,kg,esfuerzo,fecha').eq('client_id',userId).eq('fase',faseHoy).order('fecha',{ascending:false}).limit(50);
    (clR.data||[]).forEach(function(r){
      if(!cargaLog[r.exercise_id])cargaLog[r.exercise_id]=r;
      if(r.patron&&!cargaLog['pat_'+r.patron+'_'+r.escenario])cargaLog['pat_'+r.patron+'_'+r.escenario]=r;
    });
  }
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const nextWeek=new Date();nextWeek.setDate(nextWeek.getDate()+7);
  function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  const upcomingR=await sb.from('scheduled_sessions').select('*').eq('client_id',userId).gte('scheduled_date',localDate(tomorrow)).lte('scheduled_date',localDate(nextWeek)).order('scheduled_date').limit(6);
  const upcomingSchedule=upcomingR.data||[];
  const allSchedR=await sb.from('scheduled_sessions').select('*').eq('client_id',userId).gte('scheduled_date',today()).order('scheduled_date').limit(62);
  const allSchedule=allSchedR.data||[];
  const defaultWeek=currentProgWeek(lastBleeding,cycleLen);
  set({loading:false,view:perfilExt.estado==='pausada'?'pausa':PROG.length===0?'no_prog':'main',tab:'hoy',profile:profile,prog:prog,PROG:PROG,week:defaultWeek,cycleHistory:cycleHistory,lastBleeding:lastBleeding,cycleLen:perfilExt.duracion_ciclo||28,symLog:symLog,menoLog:menoLog,meas:results[5].data||[],completions:completions,todaySchedule:todaySchedule,upcomingSchedule:upcomingSchedule,allSchedule:allSchedule,perfilExt:perfilExt,checkin:checkin,motorTarjeta:motorTarjeta,escenario:escenario,cargaLog:cargaLog,grupoData:grupoData,variantes:variantes,consFotos:consFotos,clases:clases,motor:motor,motivoHoy:null});
  aplicarMotor();
}

function buildProg(prog){
  if(!prog||!prog.sessions)return [];
  const weeks=[];
  prog.sessions.forEach(function(s){if(weeks.indexOf(s.week_number)<0)weeks.push(s.week_number)});
  weeks.sort(function(a,b){return a-b});
  return weeks.map(function(wn){
    return prog.sessions.filter(function(s){return s.week_number===wn}).sort(function(a,b){return a.day_number-b.day_number}).map(function(sess){
      return {
        id:sess.id,week:wn,day:'Día '+sess.day_number,type:sess.session_type,
        ex:(sess.exercises||[]).sort(function(a,b){return a.order_index-b.order_index}).map(function(ex){
          return {eid:ex.id,n:ex.name,m:ex.muscle_group,sets:ex.sets_count,reps:ex.reps_range,v:ex.video_url||'',bloque:ex.bloque||null,patron:ex.patron||null,carga_pct:ex.carga_pct||null,carga_kg:ex.carga_kg||null,tempo:ex.tempo||null,cue:ex.cue||null,familia:ex.familia||null,equipo:ex.equipo||null,impacto:ex.impacto||null}
        })
      }
    });
  });
}

// ── CRONÓMETRO DE INTERVALOS (cardio) ───────────────────────────
// (APP_VERSION: subirla en cada publicación; se ve en el encabezado para saber si el celular tiene la última)
// Vive fuera de #app para que render() no lo borre. Suena y vibra en cada cambio,
// marca la serie al terminar cada ronda y mantiene la pantalla encendida.
const CRONO={on:false};
function parseIntervalo(reps){
  const p=String(reps||'').split('·').map(function(s){return s.trim();});
  const t=(p[0].match(/^(\d+)\s*(?:s|seg|segundos)$/i)||[])[1];
  const d=(String(reps||'').match(/(\d+)\s*s\s*desc/i)||[])[1];
  return t?{trabajo:+t,descanso:d?+d:0}:null;
}
function cronoBeep(frec,dur){
  try{
    if(!CRONO.ctx)CRONO.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=CRONO.ctx.createOscillator(),g=CRONO.ctx.createGain(),t0=CRONO.ctx.currentTime;
    o.frequency.value=frec;o.connect(g);g.connect(CRONO.ctx.destination);
    g.gain.setValueAtTime(0.35,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.start(t0);o.stop(t0+dur);
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(Math.round(dur*1000));}catch(e){}
}
function cronoFase(fase,seg){
  CRONO.fase=fase;CRONO.fin=Date.now()+seg*1000;CRONO.ultimo=seg;
}
function iniciarCrono(btn){
  const d=btn.dataset;const iv=parseIntervalo(d.reps);if(!iv)return;
  Object.assign(CRONO,{on:true,pausa:false,eid:d.eid,nombre:d.nombre,rondas:+d.rondas,ronda:1,trabajo:iv.trabajo,descanso:iv.descanso});
  try{if(!CRONO.ctx)CRONO.ctx=new (window.AudioContext||window.webkitAudioContext)();CRONO.ctx.resume();}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(w){CRONO.lock=w;}).catch(function(){});}catch(e){}
  cronoFase('prep',5);cronoBeep(660,0.15);
  clearInterval(CRONO.timer);CRONO.timer=setInterval(tickCrono,200);
  pintarCrono();
}
function tickCrono(){
  if(!CRONO.on||CRONO.pausa)return;
  const rest=Math.max(0,Math.ceil((CRONO.fin-Date.now())/1000));
  if(rest!==CRONO.ultimo){
    CRONO.ultimo=rest;
    if(rest>0&&rest<=3)cronoBeep(880,0.12);
  }
  if(rest<=0){
    if(CRONO.fase==='trabajo'){
      const k=CRONO.ronda-1;
      if(!S.completions[CRONO.eid+'_'+k])tSet(CRONO.eid,k,CRONO.rondas);
      if(CRONO.ronda>=CRONO.rondas){
        cronoBeep(1200,0.3);setTimeout(function(){cronoBeep(1200,0.7);},350);
        terminarCrono();return;
      }
      cronoBeep(440,0.6);cronoFase('descanso',CRONO.descanso);
    }else{
      if(CRONO.fase==='descanso')CRONO.ronda++;
      cronoBeep(1200,0.6);cronoFase('trabajo',CRONO.trabajo);
    }
  }
  pintarCrono();
}
function pausarCrono(){
  if(!CRONO.on)return;
  if(CRONO.pausa){CRONO.fin=Date.now()+CRONO.quedaba*1000;CRONO.pausa=false;}
  else{CRONO.quedaba=Math.max(0,(CRONO.fin-Date.now())/1000);CRONO.pausa=true;}
  pintarCrono();
}
function terminarCrono(){
  clearInterval(CRONO.timer);CRONO.on=false;
  try{if(CRONO.lock)CRONO.lock.release();}catch(e){}
  const el=document.getElementById('crono');if(el)el.remove();
  render();
}
function pintarCrono(){
  let el=document.getElementById('crono');
  if(!CRONO.on){if(el)el.remove();return;}
  if(!el){el=document.createElement('div');el.id='crono';document.body.appendChild(el);}
  const rest=CRONO.pausa?Math.ceil(CRONO.quedaba):Math.max(0,Math.ceil((CRONO.fin-Date.now())/1000));
  const F={prep:{t:'Prepárate',bg:'radial-gradient(120% 80% at 50% 0%,#3A0D0A 0%,#0E0B0A 65%)'},trabajo:{t:'¡Muévete!',bg:'radial-gradient(120% 90% at 50% 20%,#D8503F 0%,#C7372C 40%,#710D0B 100%)'},descanso:{t:'Descansa',bg:'radial-gradient(120% 80% at 50% 0%,#2A1C1A 0%,#120C0B 70%)'}}[CRONO.fase];
  el.style.cssText='position:fixed;inset:0;z-index:100;background:'+F.bg+';color:#F2E9DC;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:Karla,system-ui,sans-serif';
  el.innerHTML='<p style="font-family:Fraunces,serif;font-style:italic;font-size:17px;color:'+(CRONO.fase==='trabajo'?'#FBEFE0':'#E0C97F')+';margin-bottom:8px">'+esc(CRONO.nombre)+'</p>'
    +'<p style="font-family:Cinzel,serif;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px">Ronda '+CRONO.ronda+' de '+CRONO.rondas+'</p>'
    +'<p style="font-family:Cinzel,serif;font-size:28px;font-weight:700;letter-spacing:.06em;margin-bottom:4px;color:#fff">'+(CRONO.pausa?'En pausa':F.t)+'</p>'
    +'<p style="font-family:\'Bebas Neue\',sans-serif;font-size:150px;line-height:1;margin-bottom:30px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)">'+rest+'</p>'
    +'<div style="display:flex;gap:10px;width:100%;max-width:340px">'
    +'<button onclick="pausarCrono()" style="flex:1;padding:15px;border-radius:12px;border:1.5px solid #E0C97F;background:rgba(0,0,0,.25);color:#E0C97F;font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:.12em">'+(CRONO.pausa?'▶ SEGUIR':'⏸ PAUSAR')+'</button>'
    +'<button onclick="terminarCrono()" style="flex:1;padding:15px;border-radius:12px;border:none;background:#F2E9DC;color:#0E0B0A;font-family:Cinzel,serif;font-weight:700;font-size:13px;letter-spacing:.12em">TERMINAR</button>'
    +'</div>';
}

async function initBatchEsfuerzo(){
  const sess=S.PROG&&S.PROG[S.sessW]&&S.PROG[S.sessW][S.sessI];
  if(!sess){markSessionDone();return;}
  // Find exercises with carga_kg not yet marked today
  const withCarga=(sess.ex||[]).filter(function(ex){return ex.carga_kg;});
  const faseHoy=getCurrentFase();
  let markedToday=new Set();
  if(faseHoy){
    const r=await sb.from('carga_log').select('exercise_id').eq('client_id',S.user.id).eq('fecha',today()).eq('fase',faseHoy);
    (r.data||[]).forEach(function(row){markedToday.add(row.exercise_id);});
  }
  const needsBatch=withCarga.filter(function(ex){return !markedToday.has(ex.eid);});
  if(needsBatch.length===0){markSessionDone();return;}
  set({showBatchEsfuerzo:true,batchEsfuerzoExs:needsBatch});
}

async function markSessionDone(){
  if(!S.todaySchedule||!S.user)return;
  const {data}=await sb.from('scheduled_sessions')

    .eq('id',S.todaySchedule.id)
    .select().single();
  if(data){
    S.todaySchedule={...S.todaySchedule,status:'completed'};
    render();
  }
}
