function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(iso){if(!iso)return '';return new Date(iso).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'})}
function getCycleDay(d){if(!d)return null;return Math.floor((Date.now()-new Date(d))/86400000)+5}
function getPhase(day,len){if(!day||day<1)return null;const d=((day-1)%(len||28))+1;return PHASES.find(p=>d>=p.r[0]&&d<=p.r[1])||PHASES[3]}
function ytId(url){if(!url)return null;const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([^&?\/\s]{11})/);return m?m[1]:null}

// ── HOY ──────────────────────────────────────────────────────

const WEEK_ES=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTH_ES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function currentProgWeek(lastBleeding, cycleLen){
  if(!lastBleeding) return 0;
  const cd=getCycleDay(lastBleeding);
  if(!cd) return 0;
  if(cd<=7) return 0;
  else if(cd<=14) return 1;
  else if(cd<=21) return 2;
  else return 3;
}


function rHoy(){
  const now=new Date();
  const dateLabel=WEEK_ES[now.getDay()]+', '+now.getDate()+' '+MONTH_ES[now.getMonth()]+' '+now.getFullYear();
  const tod=S.todaySchedule;
  const perfilExt=S.perfilExt||{};

  // Buscar sesión en PROG desde manual o motor

  }
  const cleanType=(todSessType?todSessType.replace(/[🌑🌓🌕🌗⚠📅⚡🌙]/g,'').trim():'')||'Sesión de hoy';

    <p style="font-size:12px;color:${C.g2}">Tu entrenamiento del día</p>
  </div>`;

  // ── CHECK-IN (si no se ha hecho hoy) ────────────────────────────

    {campo:'molestias',label:'Molestias',ops:[{v:1,l:'Ninguna'},{v:2,l:'Algo'},{v:3,l:'Fuertes'}]},
    {campo:'sueno',   label:'Sueño',   ops:[{v:1,l:'Mal'},{v:2,l:'Regular'},{v:3,l:'Bien'}]},

  if(!checkin){

    PREGUNTAS.forEach(function(p){
      pregsHtml+='<div style="margin-bottom:11px"><p style="font-size:11px;font-weight:700;color:'+C.tl+';text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">'+p.label+'</p><div style="display:flex;gap:6px">';
      p.ops.forEach(function(o){
        const sel=draft[p.campo]===o.v;
        pregsHtml+='<button onclick="seleccionarCheckin(this.dataset.c,+this.dataset.v)" data-c="'+p.campo+'" data-v="'+o.v+'" style="flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:'+(sel?700:400)+';border:2px solid '+(sel?C.pr:C.g3)+';background:'+(sel?'#fde8e8':C.wh)+';color:'+(sel?C.pr:C.tl)+'">'+o.l+'</button>';

    h+=`<div style="background:${C.wh};border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(25,18,17,.09)">
      <p style="font-weight:800;font-size:16px;color:${C.td};margin-bottom:3px">¿Cómo amaneciste?</p>
      <p style="font-size:12px;color:${C.tl};margin-bottom:14px">Tu respuesta ajusta la sesión de hoy</p>

  } else {
    // Semáforo badge
    h+=`<div style="background:${C.wh};border-radius:11px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(25,18,17,.07)">

  if(tod&&tod.status!=='rest'){

    </div>`;
    if(isCompleted){
      h+=`<div style="background:#f0fdf4;border-radius:12px;padding:13px;text-align:center;border:1px solid #bbf7d0;margin-bottom:12px"><p style="font-weight:700;color:#16a34a">✅ Sesión completada hoy — ¡Reina!</p></div>`;
    }
  } else if(tod&&tod.status==='rest'){
    h+=card(`<div style="text-align:center;padding:16px 0">
      <p style="font-size:36px;margin-bottom:10px">🌿</p>

function mapearFaseLunar(dia,dur){
  if(dur<22||dur>40)return{fase:'menguante_b',orden:1};
  const r={
    luna_nueva:[1,5],
    creciente:[6,dur-15],
    llena:[dur-14,dur-12],
    menguante_a:[dur-11,dur-5],
    menguante_b:[dur-4,dur]
  };
  const mx={luna_nueva:5,creciente:8,llena:3,menguante_a:7,menguante_b:5};
  for(const[f,[ini,fin]]of Object.entries(r)){
    if(dia>=ini&&dia<=fin){
      const orden=((dia-ini)%mx[f])+1;
      return{fase:f,orden};
    }
  }
  return{fase:'menguante_b',orden:1};
}

async function calcularTarjetaMotor(perfil,userId,fecha){
  if(!perfil.ancla)return null;
  const ancla=new Date(perfil.ancla+'T00:00:00');
  const hoy=new Date(fecha+'T00:00:00');
  const dias=Math.floor((hoy-ancla)/86400000);
  if(dias<0)return null;
  let fase,orden;
  if(perfil.ruta==='energia'){
    const db=(dias%28)+1;
    fase='semana_'+Math.ceil(db/7);
    orden=((db-1)%7)+1;
  } else {
    const dur=perfil.duracion_ciclo||28;
    const diaCiclo=dias+1;
    if(diaCiclo>dur){
      fase='menguante_b';
      orden=(((diaCiclo-dur)-1)%5)+1;
    } else {
      const r=mapearFaseLunar(diaCiclo,dur);
      fase=r.fase;orden=r.orden;
    }
  }
  const ruta=perfil.ruta||'lunar';
  const{data}=await sb.from('plantilla_tarjetas')
    .select('*,plantillas!inner(nombre,ruta,activa)')
    .eq('fase',fase).eq('orden',orden)
    .eq('plantillas.ruta',ruta).eq('plantillas.activa',true)
    .maybeSingle();
  return{fase,orden,ruta,tarjeta:data||null};
}

function buildProg(prog){
  if(!prog||!prog.sessions)return [];
  const weeks=[];
  prog.sessions.forEach(function(s){if(weeks.indexOf(s.week_number)<0)weeks.push(s.week_number)});
  weeks.sort(function(a,b){return a-b});
  return weeks.map(function(wn){
    return prog.sessions.filter(function(s){return s.week_number===wn}).sort(function(a,b){return a.day_number-b.day_number}).map(function(sess){
      return {
        id:sess.id,week:wn,day:'Día '+sess.day_number,type:sess.session_type,
        ex:(sess.exercises||[]).sort(function(a,b){return a.order_index-b.order_index}).map(function(ex){
          return {eid:ex.id,n:ex.name,m:ex.muscle_group,sets:ex.sets_count,reps:ex.reps_range,v:ex.video_url||''}
        })
      }
    });
  });
}

  const notes=document.getElementById('mn-in')?document.getElementById('mn-in').value:'';
  const fd={client_id:S.user.id,measurement_date:date,notes:notes};
  MF.forEach(function(f){const el=document.getElementById('mf-'+f.k);const v=el?el.value:'';if(v!==''&&v!==undefined)fd[f.k]=parseFloat(v)});
  const res=await sb.from('measurements').insert(fd).select().single();
  if(res.data)set({meas:[res.data].concat(S.meas),view:'main'});
  else set({view:'main'});
}

async function doLogout(){await sb.auth.signOut();set({view:'login',user:null,profile:null,PROG:[],completions:{}})}


async function markSessionDone(){
  if(!S.todaySchedule||!S.user)return;
  const {data}=await sb.from('scheduled_sessions')
    .update({status:'completed'})
    .eq('id',S.todaySchedule.id)
    .select().single();
  if(data){
    S.todaySchedule={...S.todaySchedule,status:'completed'};
    render();
  }
}
window.set=set;window.doLogin=doLogin;window.guardarCheckin=guardarCheckin;window.marcarPeriodo=marcarPeriodo;window.borrarCheckin=borrarCheckin;window.seleccionarCheckin=seleccionarCheckin;window.ajustarSemaforo=ajustarSemaforo;window.doLogout=doLogout;window.goBack=goBack;
window.saveBleeding=saveBleeding;window.tSym=tSym;window.saveSym=saveSym;
window.saveMeno=saveMeno;window.tSet=tSet;window.tM=tM;window.saveMed=saveMed;window.today=today;window.markSessionDone=markSessionDone;

async function init(){
  try{
    const res=await sb.auth.getSession();
    if(res.data&&res.data.session){S.user=res.data.session.user;await loadClientData();}
    else render();
  }catch(e){render();}
}
init();
</script>
